# ==============================================================================
# ORDLISTE FOR KUNSTPIXEL (Felles begrepsapparat)
# Formål: Gi begge gründere et felles språk uten unødvendig teknisk sjargong.
# ==============================================================================

prosjekt:
  navn: "Kunstpixel"
  beskrivelse: >
    Vår felles treningsarena og teknologiske verktøykasse. Her eksperimenterer vi
    med digitale assistenter, nettsider, databruk og automatisering for kultur og næring.

begreper:
  digital_assistent:
    forklaring: >
      En automatisert hjelper (agent) som kan svare på spørsmål, finne frem bilder,
      skrive utkast eller utføre oppgaver for oss basert på instruksene vi gir den.
    synonymer: ["agent", "digital hjelper", "museumsvert"]
    i_praksis: "Som en ekstra kollega som alltid har lest hele samlingen og svarer på sekunder."

  raadata_og_samling:
    forklaring: >
      Grunnlagstallene, bildene og tekstene vi eier og legger inn i systemet.
    i_praksis: "Informasjonen om kunstverk, åpningstider, priser og arrangementer som vi bygger på."

  kampanje:
    forklaring: >
      Et målrettet tiltak for å nå ut til publikum på nett, sosiale medier eller nyhetsbrev.
    i_praksis: "En serie innlegg, en landingsside eller en omvisningsinvitasjon vi lager sammen."

  leveranse:
    forklaring: >
      Ferdige produkter vi produserer i fellesskap og kan vise frem eller sende fra oss.
    i_praksis: "Søknader om støtte, rapporter, ferdige nettsider eller demonstrasjoner for kunder."

  prototype:
    forklaring: >
      En rask førsteversjon av en idé, laget for å teste om konseptet fungerer i virkeligheten.
    i_praksis: "En enkel modell vi kan klikke på og diskutere, fremfor å skrive 20 sider med kravspesifikasjon."

  lav_risiko_og_skrivebeskyttelse:
    forklaring: >
      En innebygd sikkerhetslås som gjør at ingen (hverken mennesker eller AI-assistenter)
      kan slette eller ødelegge rådataene våre ved en feiltakelse.
    i_praksis: "Alt leses trygt. Du kan trykke, teste og spørre så mye du vil uten å være redd for at noe ryker."

  samhandling:
    forklaring: >
      Måten vi to jobber sammen på: Én jobber med innhold, konsept og ideer – den andre
      sikrer at systemet henger sammen teknisk.
    i_praksis: "Ingen trenger å kunne alt; vi utfyller hverandre i samme prosjekt."

  automatisering:
    forklaring: >
      Prosesser som går av seg selv når de først er satt opp, slik at vi slipper kjedelige repetisjoner.
    i_praksis: "At en rapport settes sammen automatisk fra databasen fremfor at vi klipper og limer manuelt."

  apne_kilder_og_api:
    forklaring: >
      Offisielle, gratis databaser og oppslagsverk på nett (f.eks. Store norske leksikon,
      DigitaltMuseum og SSB) som vi henter autoritativ kunnskap fra uten å bruke KI-tokens.
    synonymer: ["ekstern sannhetskilde", "fagkilde", "0-token berikelse"]
    i_praksis: "Vi slipper å finne opp kruttet eller betale for KI-skriving når nasjonale eksperter allerede har skrevet fasiten gratis for oss."

  ssot_database:
    forklaring: >
      Single Source of Truth. Én samlet lokal database (museum.db) som inneholder både
      samling, utstillinger, vaktplan, innleie og avvik for å unngå sprik mellom fagsystemer.
    synonymer: ["felles sannhetskilde", "hoveddatabase"]
    i_praksis: "Alle seks roller ser de samme tallene, slik at kurator og økonomisjef aldri er uenige om fakta."

  trelags_tekststandard:
    forklaring: >
      Fast struktur for kunstformidling i tre nivåer: Veggtekst (50–90 ord for sal),
      audioguide (130–180 ord / 60–90 sek muntlig), og barneformidling (60–100 ord med sanselig undring).
    synonymer: ["formidlingstriade", "3-lags tekst"]
    i_praksis: "Hvert verk kan formidles til alle publikumsgrupper uten at teksten må skrives om på sparket."

  doffin_og_terskelverdier:
    forklaring: >
      Norske regler for offentlige anskaffelser (LOA) med tre nivåer: Direkteanskaffelse (<100k),
      nasjonal kunngjøring på Doffin (100k–1,4 mill) og EØS-anbud (>1,4 mill).
    synonymer: ["anskaffelsesgrenser", "anbudsregler"]
    i_praksis: "Vi unngår ulovlige direkteanskaffelser og holder orden på alle innleiekontrakter."

  virke_museumstariff:
    forklaring: >
      Landsoverenskomsten for museer med lønnstrinn (20–65) og ubekvemstillegg for kveld, helg og overtid.
    synonymer: ["tariffavtale", "lønnstrinn"]
    i_praksis: "Vaktkostnader og overtid beregnes nøyaktig og i tråd med norsk arbeidsrett."

  aml_hviletid:
    forklaring: >
      Arbeidsmiljølovens § 10-8 krav om minimum 11 timer sammenhengende hvile per 24 timer
      og 35 timer per uke.
    synonymer: ["daglig hvile", "døgnhvile", "11-timersregelen"]
    i_praksis: "En vaktleder kan aldri sette opp en ansatt på morgenvakt kl. 08:00 hvis vedkommende jobbet til 22:00 kvelden før."

  styrk08_yrkeskode:
    forklaring: >
      Standard for yrkesklassifisering (SSB STYRK-08) som entydig koder museumsfaglige
      stillinger (f.eks. kurator 2651, konservator 2621, salvert 5113).
    synonymer: ["yrkeskode", "STYRK", "stillingskode"]
    i_praksis: "Sikrer at ansatte innplasseres i riktig lønns- og kompetansekategori overfor myndigheter og tariff."

  renholdsregisteret:
    forklaring: >
      Arbeidstilsynets autoritative register over godkjente renholdsvirksomheter med krav om godkjente HMS-kort.
    synonymer: ["godkjent renholdsbedrift", "HMS-kort renhold"]
    i_praksis: "Museet kan aldri leie inn renholdere som mangler offentlig godkjenning fra Arbeidstilsynet."

  stami_ergonomi_rotasjon:
    forklaring: >
      Statens arbeidsmiljøinstitutts faglige retningslinjer for stående arbeid på hardt underlag,
      med krav om maks 2 timer sammenhengende salvakt og obligatorisk sittepause/rotasjon.
    synonymer: ["salrotasjon", "ergonomisk avlastning"]
    i_praksis: "Museumsverter roterer jevnlig mellom salovervåking og skranke/kiosk for å hindre belastningsskader i rygg og ben."

  virksomhetshandboker:
    forklaring: >
      Aura Kunstmuseums fire autoritative styrings- og veiledningsdokumenter: Personalhåndbok,
      HMS- og Sikkerhetshåndbok, Drifts- og Kvalitetshåndbok, og Leder- og Beredskapshåndbok.
    synonymer: ["museumshåndbøker", "ansatthåndbok", "styringshåndbøker"]
    i_praksis: "Håndbøkene sikrer at alle ansatte og ledere vet nøyaktig hva som gjelder for vakt, HMS, kafé og beredskap."

  to_lags_handbokarkitektur:
    forklaring: >
      Kombinasjon av fullstendige menneskelesbare Markdown-dokumenter og en indeksert SQLite/FastMCP-database
      som tillater umiddelbare og token-effektive oppslag ved behov.
    synonymer: ["on-demand håndbok", "selektivt oppslag"]
    i_praksis: "En museumsvert eller AI kan spørre om én spesifikk regel uten å måtte laste inn hele personalhåndboken på 50 sider."

  oppslagsverk:
    forklaring: >
      Internsidens inngang til kvalitetssystemet og dokumentasjonen, organisert etter rolle:
      den ansatte velger sin rolle og ser hva som gjelder for den. Låst 2026-10-23 (grilling).
    synonymer: ["kvalitetsoppslag", "dokumentoppslag"]
    i_praksis: "En salvert åpner oppslagsverket og ser rutinene, håndbokpunktene og reglene som gjelder salverter, ikke hele bunken."
    ikke: "Ikke en tilsyns- eller revisorvisning i første runde. Det kan komme senere som et filter."
    innhold: >
      Håndbøkene og rutinene (SOP) og reglene (hr_rules, rapport_regler) som lesbare regler. Skal fungere
      som en ekte dokumenthåndbok, men AI-basert. Ikke HR-saker eller nasjonal HMS-veiledning i første runde.
    ai_rolle: >
      AI (Claude via API) svarer på spørsmål og viser hvilke punkter svaret bygger på, merket AI-forslag.
      Finner den ingen kilde, sier den det. Dokumentene er fasit og endres aldri av AI.
      Plassering etter designsystemet, minst mulig støy: ett søkefelt i midten, AI-svaret kort øverst over
      de vanlige treffene. Ingen chat. Siden virker også uten AI.
    dokumentstyring: >
      Lett: hvert dokument og punkt har ID, versjon og sist revidert. Ikke eier, godkjenning eller revisjonsfrister.

  kompetanse:
    forklaring: >
      To lag. Sertifikat: dokumentert ferdighet med sertifiseringsdato og eventuelt utløp (f.eks. førstehjelp, kran).
      Fagområde: strategisk kompetanse med nivå 1–3 (f.eks. kuratering, registrar, digital formidling).
      Låst 2026-10-23 (grilling).
    synonymer: ["ferdighet", "kompetansebevis"]
    i_praksis: "En utstilling kan kreve både to med gyldig kranbevis (sertifikat) og én registrar på nivå 3 (fagområde)."

  kompetanseplan:
    forklaring: >
      Plan som sammenligner kompetansebehovet i utstillinger og interne prosjekter med kompetansen museet har,
      og foreslår tiltak der det mangler. Horisont: kalenderåret 2027, delt i kvartaler.
      Tilgangen regnes uten avgang: alle som er ansatt nå, er med hele året. Låst 2026-10-23 (grilling).
    synonymer: ["kompetanseplanlegging", "gap-analyse"]
    i_praksis: "Planen viser at høsten 2027 mangler to kunsthåndterere, og foreslår kurs eller innleie."

  arbeidsrolle:
    forklaring: >
      Én av 6–8 faste roller som styrer oppslagsverket (f.eks. Salvert, Montør/drift, Kafé, Formidling,
      Samling/kurator, Leder, Verneombud). Hver stilling i hr_ansatte og hver målgruppe i håndbøkene kobles til
      én eller flere arbeidsroller. Låst 2026-10-23 (grilling).
    synonymer: ["rolle i oppslagsverket"]
    i_praksis: "En kaféleder er både Kafé og Leder, og ser rutinene for begge."

  fagomrade:
    forklaring: >
      Strategisk kompetanse med nivå 1–3, i fire grupper: Samling og bevaring (registrar og innlån, konservering,
      proveniens), Formidling og publikum (pedagogikk, DKS, digital formidling), Kuratering og forskning,
      og Ledelse og drift (prosjektledelse, økonomi, teknisk drift). Låst 2026-10-23 (grilling).
      Nivå settes ut fra utdanning og erfaring i faget: 1 = relevant kurs eller bachelor og under 2 år,
      2 = bachelor og 2–5 år eller master, 3 = master og over 5 år. Tersklene ligger i en CSV og kan justeres.
    synonymer: ["kompetanseområde", "strategisk kompetanse"]
    i_praksis: "Innlånene i 2027 krever én registrar på nivå 3 under Samling og bevaring."
    ikke: "Ikke det samme som roller A–L i Datafinner (der er også utviklerroller), og ikke stillingstittel."

  internt_prosjekt:
    forklaring: >
      Tidsavgrenset intern satsing som ikke er en utstilling, men krever kompetanse, f.eks. digitalisering av
      samlingen, nytt billettsystem, DKS-program eller magasinflytting. 4–6 syntetiske prosjekter i 2027.
      Låst 2026-10-23 (grilling).
    synonymer: ["prosjekt", "satsing"]
    i_praksis: "Digitaliseringsprosjektet trenger registrar på nivå 3 og to med fotokompetanse i første halvår."

  kompetansetiltak:
    forklaring: >
      Det kompetanseplanen foreslår der behov er større enn tilgang: kurs, rekruttering eller innleie.
      Velges med faste regler etter varighet og gjentakelse, med terskler i en CSV (som rapport_regler).
      Engangsbehov gir innleie, gjentatt behov eller sertifikat gir kurs, varig mangel på nivå 3 gir rekruttering.
      Låst 2026-10-23 (grilling).
    synonymer: ["tiltak", "lukke gap"]
    i_praksis: "Kranbevis mangler i tre monteringsuker i 2027, så regelen foreslår kurs for to egne montører."

  rollekrav:
    forklaring: >
      Faste kompetansekrav per arbeidsrolle (sertifikater og eventuelt fagområde med nivå). Vises i oppslagsverket
      og teller som grunnbehov i kompetanseplanen. Behov = rollekrav (drift) + ekstra fra utstillinger og prosjekter.
      Låst 2026-10-23 (grilling).
    synonymer: ["minimumskrav", "grunnbehov"]
    i_praksis: "Alle salverter skal ha gyldig førstehjelp. Utløper fem kurs i mars 2027, viser planen et gap i drift selv uten utstilling."

  skjermet_varsel:
    forklaring: >
      Henvendelse i kategorien varsling (CASE-013, aml. kap. 2 A). Verktøyene viser aldri ansatt, avdeling,
      fritekst eller klokkeslett, og varsler kan ikke slås opp via ansatt-ID. Beholdt med vilje som demonstrert
      prinsipp, ikke som forsiktighet. Låst 2026-10-23 (grilling).
    synonymer: ["konfidensielt varsel"]
    i_praksis: "search_internal_requests('varsling') viser tittel, dato og hjemmel, men ikke hvem som varslet."

  notatbok_og_datautforsking:
    forklaring: >
      Interaktiv arbeidsflate (.ipynb-notatbok med Data Wrangler i VS Code og Antigravity) som kobler fri
      tabellutforsking (mode=ro) med museets ferdige fasit-kalkulatorer i db.py for lønn, overtid og fravær.
    synonymer: ["tall-utforsking", "Jupyter-notatbok", "Data Wrangler"]
    i_praksis: "Du kan se tabeller som regneark, lage grafer og utforske nye koblinger helt trygt uten at tallene avviker fra nettsiden."




