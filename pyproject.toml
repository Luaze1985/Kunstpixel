[project]
name = "kunstpixel"
version = "0.1.0"
description = "Kunstpixel (kunstpixel.com) MCP Server and Demo-Prototype"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.29.1",
    "fastmcp>=3.4.2",
    "pydantic>=2.12.5",
    "rich>=15.0.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
# Worktrees og arbeidsmapper skal ikke sjekkes (de er kopier eller midlertidige).
extend-exclude = [".worktrees", ".claude", ".scratch", "arkiv", ".serena", ".playwright-mcp"]

[tool.ruff.lint]
# Bare virkelige feil, ikke stil: syntaksfeil (E9), pyflakes (F: ubrukt import/variabel) og sannsynlige feil (B).
# Stilregler (E, W) ga 1944 funn 2026-10-24 og er med vilje utelatt. Utvid regelsettet i små steg.
select = ["E9", "F", "B"]
