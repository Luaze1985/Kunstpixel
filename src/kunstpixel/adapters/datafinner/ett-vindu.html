<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Datafinner – ett vindu</title>
<link rel="stylesheet" href="/af.css">
<script src="/ledelse.js"></script>
</head>
<body class="af" style="margin:0;padding:24px 16px;background:var(--canvas)">
<div class="af">
  <div class="af-shell af-no-context">
    <!-- Venstre: hovedting (Hjem, finn data, mer) og rollen nederst. Midten: der du er og arbeidet.
         Høyre: huskelapp med fasit og én handling. Etappe 1, 2026-11-16. -->
    <nav class="af-sidebar" aria-label="Innhold">
      <p class="af-side-heading">Datafinner</p>
      <div id="meny"><p class="af-task-hint">Henter …</p></div>
      <!-- Rollen styrer hvilke rapporter som foreslås. Ligger nederst, som en profil. Valget huskes i fanen. -->
      <div class="af-group" style="margin:18px 8px 0;padding-top:14px;border-top:1px solid var(--line)">
        <label class="af-label" for="rollevalg">Jeg er</label>
        <select class="af-input" id="rollevalg"><option value="">Velg rolle</option></select>
      </div>
    </nav>

    <main class="af-main">
      <div class="af-mobile-nav">
        <label for="mobilvalg">Gå til</label>
        <select id="mobilvalg"></select>
      </div>
      <!-- Brødsmuler: hvor du er, og en synlig vei ett nivå opp. Nettleserens tilbake/frem virker også. -->
      <nav id="sti" class="af-actions" aria-label="Du er her" style="margin:0 0 14px;padding:0;border:0;gap:8px;font-size:.85rem"></nav>
      <div id="midt" aria-live="polite"></div>
    </main>

    <aside class="af-context" aria-label="Fasit" hidden>
      <h2 class="af-context-title">Fasit</h2>
      <div class="af-context-card">
        <p style="margin:0 0 12px">Tallene kommer fra databasen. KI formulerer bare.</p>
        <p style="margin:0 0 10px"><span class="af-small-label">Verktøy</span><span id="f-verktoy" style="overflow-wrap:anywhere">Ingen ennå</span></p>
        <p style="margin:0 0 10px"><span class="af-small-label">Kilde</span><span id="f-kilde" style="overflow-wrap:anywhere">museum.db, kun lesing</span></p>
        <p style="margin:0 0 10px" id="f-regel-kort" hidden><span class="af-small-label">Regel</span><span id="f-regel" style="overflow-wrap:anywhere"></span></p>
        <p style="margin:0"><span class="af-small-label">KI</span><span id="f-ki">Sjekker …</span></p>
        <div class="af-actions" id="f-handling" style="margin-top:14px;padding-top:14px">
          <button type="button" class="af-btn af-btn-primary" id="f-spor-ki">Spør KI om dette</button>
        </div>
      </div>
    </aside>
  </div>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, tekst) { var e = document.createElement(tag); if (cls) e.className = cls; if (tekst !== undefined && tekst !== null) e.textContent = tekst; return e; }
  function hent(url, opts) { return fetch(url, opts).then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.error || ("HTTP " + r.status)); return d; }); }); }
  function post(url, body) { return hent(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }); }

  var KI = false, KI_MODELL = "", ROLLER = [], SPORSMAL = {}, SKJEMA = {}, AREA = { omrader: [], caser: [] };
  var valgt = null, aktivRolle = null;
  var EMNE = null;  // det som vises i midten nå (rapport, case, tabell). Brukes av «Spør KI om dette».
  try { aktivRolle = sessionStorage.getItem("datafinner-rolle") || "Museumsdirektør"; } catch (e) { aktivRolle = "Museumsdirektør"; }

  // Flatene under «Mer». Søk og Arbeidsflyter er fjernet (Lars 2026-11-16): KI-chatten dekker søk.
  var FLATER = [
    { id: "vaktrom", navn: "Vaktrom" }
  ];

  // Felt som ikke hører hjemme i en demotabell (kontaktinfo, interne nøkler, datamerker).
  var SKJULT = /(^|_)(id|datakilde|telefon|epost)$|^(telefon|epost|kontor_sal|klokkeslett_datakilde)$/;
  // Hvem/hva først i tabeller, så det synes hvem raden gjelder (stilling og stasjon viser kafé-blandingen i vaktene).
  var FORST = ["navn", "tittel", "rapport", "mal_navn", "avsnitt_tittel", "stilling", "rolle", "stasjon", "start", "slutt", "malgruppe"];
  // Lokal dato, ikke UTC: toISOString() ga gårsdagen mellom kl. 00 og 01.
  function lokalDato(d) { function to(n) { return (n < 10 ? "0" : "") + n; } return d.getFullYear() + "-" + to(d.getMonth() + 1) + "-" + to(d.getDate()); }
  var STANDARD = { dato: function () { return lokalDato(new Date()); }, maaned: function () { return lokalDato(new Date()).slice(0, 7); },
    aar: function () { return 2025; }, kvartal: function () { return 2; }, exhibition_id: function () { return "KP-EXH-2020-041"; },
    ident: function () { return "KP-ANS-001"; }, ansatt_id: function () { return "KP-ANS-001"; }, mottakertype: function () { return "ekstern"; },
    mal_id: function () { return "ML-01"; }, kategori: function () { return "hms_opplaering"; }, intern_eier: function () { return "Museumsdirektør"; } };
  var ETIKETT = { dato: "Dato", maaned: "Måned", aar: "År", kvartal: "Kvartal", exhibition_id: "Utstilling", ident: "Ansatt", ansatt_id: "Ansatt",
    query: "Søk", mottakertype: "Mottaker", mal_id: "Rapportmal", kategori: "Kategori", intern_eier: "Intern eier" };

  // ---------- Høyre panel ----------
  function fasit(verktoy, args, kilde, regel) {
    var vis = !!(verktoy || kilde || regel);
    document.querySelector(".af-context").hidden = !vis;
    document.querySelector(".af-shell").classList.toggle("af-no-context", !vis);
    $("f-verktoy").textContent = verktoy ? verktoy + "(" + (args && Object.keys(args).length ? JSON.stringify(args) : "") + ")" : "Ingen ennå";
    $("f-kilde").textContent = kilde || "museum.db, kun lesing";
    $("f-regel-kort").hidden = !regel;
    $("f-regel").textContent = regel || "";
    // Én handling i huskelappen: ta med det du ser til KI. Skjult i chatten selv og når KI er av.
    var iChat = (valgt || "flate:chat") === "flate:chat";
    $("f-handling").style.display = KI && EMNE && !iChat ? "" : "none";  // display, fordi af.css overstyrer hidden
    FASIT_SIST = { verktoy: verktoy, args: args };
  }
  var FASIT_SIST = {};
  $("f-spor-ki").addEventListener("click", function () {
    var data = FASIT_SIST.verktoy ? " (data fra " + FASIT_SIST.verktoy + (FASIT_SIST.args && Object.keys(FASIT_SIST.args).length ? " " + JSON.stringify(FASIT_SIST.args) : "") + ")" : "";
    CHAT.utkast = "Forklar «" + EMNE + "»" + data + ". Hva bør jeg som " + (aktivRolle || "leder") + " følge opp?";
    vis("flate:chat");
  });

  // ---------- Venstre meny ----------
  function antall(n, en, flere) { return n + " " + (n === 1 ? en : flere); }
  function rolle(navn) { return ROLLER.filter(function (r) { return r.navn === navn; })[0] || null; }
  // Bare roller med rapporter vises. Utviklerrollene (Repo, Kontekst, MCP) har ingen og faller bort av seg selv.
  function synligeRoller() { return ROLLER.filter(function (r) { return r.sporsmal.length; }); }
  function husk(navn) { aktivRolle = navn; try { sessionStorage.setItem("datafinner-rolle", navn || ""); } catch (e) {} }

  function tegnMeny() {
    var meny = $("meny"), mobil = $("mobilvalg"), rv = $("rollevalg");
    meny.textContent = ""; mobil.textContent = "";
    rv.length = 1;
    synligeRoller().forEach(function (r) { var o = el("option", null, r.navn); o.value = r.navn; rv.appendChild(o); });
    rv.value = aktivRolle || "";
    function gruppe(tittel, punkter, kunMobil, container) {
      var og = el("optgroup"); og.label = tittel || "Start";
      if (kunMobil) { punkter.forEach(function (p) { var op = el("option", null, p.navn); op.value = p.id; og.appendChild(op); }); mobil.appendChild(og); return; }
      if (tittel) (container || meny).appendChild(el("p", "af-side-heading", tittel));
      var ol = el("ol", "af-flow-list");
      punkter.forEach(function (p) {
        // p.klikk og p.dataId brukes av vaktrom-stegene, som styres av vaktrom.js og ikke av adressen.
        var li = el("li"), b = el("button", "af-flow-link"); b.type = "button"; b.dataset.id = p.dataId || p.id;
        var t = el("span", null, p.navn); if (p.status) t.appendChild(el("span", "af-step-status", p.status));
        b.appendChild(t); b.addEventListener("click", p.klikk || function () { vis(p.id); });
        if (p.aktiv) b.setAttribute("aria-current", "step");
        else if (!p.klikk && (valgt === p.id || (valgt && valgt.indexOf(p.id + "/") === 0))) b.setAttribute("aria-current", "page");
        li.appendChild(b); ol.appendChild(li);
        var op = el("option", null, p.navn); op.value = p.id; og.appendChild(op);
      });
      (container || meny).appendChild(ol); mobil.appendChild(og);
    }
    // Hjem er KI-chatten. Den står alltid først, også i mobilvalget.
    gruppe(null, [{ id: "flate:chat", navn: "Hjem", status: KI ? null : "KI utilgjengelig" }]);
    // Mens vaktrommet er åpent, står stegene rett under Hjem.
    if (VAKTROM.api && (valgt || "").indexOf("flate:vaktrom") === 0) {
      gruppe("Vaktrom", VAKTROM.api.steg.map(function (s, i) {
        return { id: "vaktrom-steg:" + s[0], dataId: s[0], navn: (i + 1) + ". " + s[1], aktiv: VAKTROM.steg === s[0],
          klikk: function () { VAKTROM.api.gaa(s[0]); } };
      }));
    }
    var r = rolle(aktivRolle);
    var rollePunkter = synligeRoller().map(function (x) { return { id: "rolle:" + x.navn, navn: x.navn, status: antall(x.sporsmal.length, "rapport", "rapporter") }; });
    gruppe("Finn data", [
      { id: "rolle:" + (r ? r.navn : "Museumsdirektør"), navn: "Rapporter" },
      { id: "katalog", navn: "Tabeller" }
    ]);
    var mer = el("details", "af-nav-more"), merInnhold = el("div");
    mer.appendChild(el("summary", null, "Mer"));
    mer.appendChild(merInnhold); meny.appendChild(mer);
    mer.open = !!(valgt && (valgt.indexOf("arena") === 0 || (valgt.indexOf("flate:") === 0 && valgt !== "flate:chat")));
    gruppe("Arena", AREA.omrader.map(function (o) {
      var n = AREA.caser.filter(function (c) { return c.omrade === o.id; }).length;
      return { id: "arena:" + o.id, navn: o.navn, status: n + (n === 1 ? " case" : " caser") };
    }), false, merInnhold);
    gruppe("Bemanning", FLATER.map(function (f) { return { id: "flate:" + f.id, navn: f.navn }; }), false, merInnhold);
    if (r) gruppe("Bytt rolle", rollePunkter, true);  // I mobilvisning finnes ikke rollevalget i sidemenyen.
    mobil.value = (valgt || "flate:chat").split("/")[0];  // Valget kjenner bare toppnivået (rolle, område, flate).
  }
  $("mobilvalg").addEventListener("change", function () {
    if (this.value.indexOf("vaktrom-steg:") === 0 && VAKTROM.api) return VAKTROM.api.gaa(this.value.slice(13));
    vis(this.value);
  });
  $("rollevalg").addEventListener("change", function () {
    husk(this.value || null);
    if (this.value) return vis("rolle:" + this.value);
    if (location.hash) location.hash = ""; else ruter();  // Uten rolle: tilbake til «Hvem er du?».
  });

  // ---------- Midten ----------
  function tom(caption, tittel, ingress) {
    var m = $("midt"); m.textContent = "";
    if (caption) m.appendChild(el("p", "af-caption", caption));
    var h = el("h1", "af-title", tittel); h.tabIndex = -1; m.appendChild(h);
    EMNE = tittel;
    if (ingress) m.appendChild(el("p", "af-lead", ingress));
    h.focus({ preventScroll: true });
    return m;
  }
  function kort(liste, punkter) {
    var ul = el("ul", "af-task-board");
    punkter.forEach(function (p) {
      // Samme oppbygging som kortene på forsiden: tekst til venstre, merke til høyre.
      var li = el("li"), b = el("button", "af-task-card"); b.type = "button";
      var t = el("span"); t.appendChild(el("strong", null, p.navn));
      if (p.tekst) t.appendChild(el("small", null, p.tekst));
      b.appendChild(t);
      if (p.merke) b.appendChild(el("span", "af-badge", p.merke));
      b.addEventListener("click", p.klikk); li.appendChild(b); ul.appendChild(li);
    });
    liste.appendChild(ul);
  }

  function visStart() {
    if (aktivRolle && rolle(aktivRolle)) return visRolle(aktivRolle);
    var m = tom(null, "Hvem er du?", "Velg rolle, så foreslår Datafinner rapportene som passer. Svaret kommer i midten, og fasiten (verktøy og kilde) står til høyre.");
    kort(m, synligeRoller().map(function (r) {
      return { navn: r.navn, tekst: r.beskrivelse, merke: antall(r.sporsmal.length, "rapport", "rapporter"), klikk: function () { vis("rolle:" + r.navn); } };
    }));
    fasit(null);
  }

  function visRolle(navn) {
    var r = rolle(navn); if (!r) { husk(null); return visStart(); }
    husk(navn);
    var m = tom("Rapporter for", r.navn, r.beskrivelse);
    kort(m, r.sporsmal.map(function (id) {
      var s = SPORSMAL[id] || { tekst: id };
      // Vis hva svaret gjelder når man klikker: «Standard: År 2025, Kvartal 2». Fritekstsøk uten verdi gir de første treffene.
      var std = parametre(id).map(function (p) { var v = STANDARD[p.navn] ? STANDARD[p.navn]() : ""; return v === "" ? null : (ETIKETT[p.navn] || p.navn) + " " + v; }).filter(Boolean);
      var harSok = parametre(id).some(function (p) { return p.navn === "query"; });
      var tekst = std.length ? "Standard: " + std.join(", ") + ". Kan endres." : harSok ? "Viser de første treffene. Du kan søke." : "Ett klikk gir svaret.";
      return { navn: s.tekst, tekst: tekst, klikk: function () { vis("rolle:" + navn + "/" + id); } };
    }));
    fasit(null);
  }

  function parametre(id) {
    var s = SPORSMAL[id] || {}, t = SKJEMA[s.verktoy] || {}, p = t.parametre || {}, krav = p.required || [];
    var navn = krav.slice(); if (!krav.length && p.properties && p.properties.query) navn.push("query");
    // Valgfrie felt spørsmålet trenger (rapportmaler: mal_id). Står i SPORSMAL på serveren.
    (s.parametre || []).forEach(function (n) { if (navn.indexOf(n) < 0 && p.properties && p.properties[n]) navn.push(n); });
    return navn.map(function (n) { return { navn: n, type: (p.properties[n] || {}).type, hjelp: (p.properties[n] || {}).description }; });
  }

  // Adresse for en rapport med valg: rolle:HR og bemanning/vaktplan?dato=2026-11-14[&rad=3]. Verdiene kodes hver for seg.
  function rapportAdresse(rolleNavn, id, args, rad) {
    var q = Object.keys(args || {}).map(function (k) { return k + "=" + encodeURIComponent(args[k]); });
    if (rad !== null && rad !== undefined) q.push("rad=" + rad);
    return "rolle:" + rolleNavn + "/" + id + (q.length ? "?" + q.join("&") : "");
  }
  function lesValg(tekst) {
    var ut = {};
    (tekst || "").split("&").forEach(function (par) { if (!par) return; var i = par.indexOf("="); if (i > 0) ut[par.slice(0, i)] = decodeURIComponent(par.slice(i + 1)); });
    return ut;
  }

  function visSporsmal(rolle, id, valg) {
    valg = valg || {};
    var rad = valg.rad !== undefined ? Number(valg.rad) : null;
    var s = SPORSMAL[id] || { tekst: id };
    var m = tom(rolle, s.tekst);
    var felt = parametre(id), form = el("form");
    form.noValidate = true;
    felt.forEach(function (f) {
      var g = el("div", "af-group"), l = el("label", "af-label", ETIKETT[f.navn] || f.navn), i = el("input", "af-input");
      i.id = "p-" + f.navn; l.htmlFor = i.id; i.name = f.navn;
      i.type = f.navn === "dato" ? "date" : f.navn === "maaned" ? "month" : f.type === "integer" ? "number" : "text";
      i.value = f.navn in valg ? valg[f.navn] : STANDARD[f.navn] ? STANDARD[f.navn]() : "";
      g.appendChild(l); if (f.hjelp) g.appendChild(el("span", "af-hint", f.hjelp)); g.appendChild(i); form.appendChild(g);
    });
    var a = el("div", "af-actions"), b = el("button", "af-btn af-btn-secondary", "Oppdater"); b.type = "submit";
    a.appendChild(b); form.appendChild(a); m.appendChild(form);
    // Svaret hentes med en gang med standardverdiene. Knappen trengs bare når det finnes felt å endre.
    // (display, fordi af.css overstyrer hidden.)
    if (!felt.length) a.style.display = "none";
    var ut = el("div"); m.appendChild(ut);
    var forste = true;
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var args = {};
      felt.forEach(function (f) { var v = form.elements[f.navn].value.trim(); if (v !== "") args[f.navn] = f.type === "integer" ? Number(v) : v; });
      // Endrede valg legges i adressen, så tilbake/frem virker. Første visning bruker adressen som den er.
      var adresse = rapportAdresse(rolle, id, args, null);
      if (!forste && adresse !== rapportAdresse(rolle, id, lesValg(((valgt || "").split("?")[1] || "").replace(/(^|&)rad=\d+/, "")), null)) return vis(adresse);
      forste = false;
      b.disabled = true; ut.textContent = ""; ut.appendChild(el("p", "af-task-hint", "Henter …"));
      hent("/api/rapport?sporsmal=" + encodeURIComponent(id) + "&args=" + encodeURIComponent(JSON.stringify(args)))
        .then(function (r) { tegnRapport(ut, r, { rad: rad, lenke: function (i) { return rapportAdresse(rolle, id, args, i); }, lukk: rapportAdresse(rolle, id, args, null) }); })
        .catch(function (err) { ut.textContent = ""; var f = el("div", "af-error-summary"); f.setAttribute("role", "alert"); f.appendChild(el("h2", null, "Fant ikke svar")); f.appendChild(el("p", null, err.message)); ut.appendChild(f); })
        .then(function () { b.disabled = false; });
    });
    fasit(s.verktoy, null);
    form.requestSubmit();  // Ett klikk i menyen gir rapporten.
  }

  // Generisk visning av et verktøysvar: nøkkeltall, én tabell, resten som liste.
  // Feltnavn til lesbar etikett: antall_pa_jobb → «Antall på jobb».
  // Kjente navn (Måned, Formål, År …) slås opp i ledelse.js (F4). Resten får de gamle erstatningene.
  function etikett(k) { return Ledelse.etikett(k).replace(/\bpa\b/g, "på").replace(/\bnok\b/g, "kr").replace(/aa/g, "å").replace(/\b([Bb])esok/g, "$1esøk"); }
  // Tabell der hver rad kan åpnes. valg.lenke(i) gir adressen til rad i (rapporter, så tilbake lukker detaljen);
  // uten valg.lenke åpnes detaljen rett under tabellen.
  function tabell(rader, valg) {
    valg = valg || {};
    // Kolonner der alle rader har samme verdi (f.eks. dato) sier ingenting i tabellen.
    var kol = Object.keys(rader[0] || {}).filter(function (k) {
      if (SKJULT.test(k) || typeof rader[0][k] === "object") return false;
      return rader.length < 2 || rader.some(function (r) { return r[k] !== rader[0][k]; });
    });
    // Hvem/hva først (FORST), så kopier av en tidligere kolonne bort (rolle = stilling vises som Stilling),
    // og maks 5 kolonner så tabellen får plass i midten uten sidelengs rulling (F6). Alle felt står i raddetaljen.
    var forst = FORST.filter(function (k) { return kol.indexOf(k) >= 0; });
    kol = forst.concat(kol.filter(function (k) { return forst.indexOf(k) < 0; }));
    kol = kol.filter(function (k, i) { return !kol.slice(0, i).some(function (f) { return rader.every(function (r) { return r[f] === r[k]; }); }); }).slice(0, 5);
    var boks = el("div"), wrap = el("div", "af-table-wrap"), t = el("table", "af-table"), th = el("thead"), tr = el("tr"), tb = el("tbody");
    var detalj = el("div");
    kol.forEach(function (k) { tr.appendChild(el("th", null, etikett(k))); }); th.appendChild(tr);
    function tegnRader(n) {
      tb.textContent = "";
      rader.slice(0, n).forEach(function (r, i) {
        var x = el("tr");
        kol.forEach(function (k, j) {
          var td = el("td");
          if (j === 0) {
            // Første celle åpner raden. Lenke (ikke knapp), så den kan åpnes i ny fane og leses av skjermleser.
            var a = el("a", null, verdi(r[k], k) || "Åpne");
            a.href = valg.lenke ? "#" + encodeURIComponent(valg.lenke(i)) : "#";
            if (!valg.lenke) a.addEventListener("click", function (e) { e.preventDefault(); detalj.textContent = ""; detalj.appendChild(radDetalj(r, i, rader.length, function () { detalj.textContent = ""; })); });
            td.appendChild(a);
          } else td.textContent = verdi(r[k], k);
          x.appendChild(td);
        });
        tb.appendChild(x);
      });
    }
    tegnRader(50);
    t.appendChild(th); t.appendChild(tb); wrap.appendChild(t); boks.appendChild(wrap);
    if (rader.length > 50) {
      var flere = el("button", "af-btn af-btn-secondary", "Vis alle " + rader.length.toLocaleString("nb-NO") + " rader"); flere.type = "button";
      flere.addEventListener("click", function () { tegnRader(rader.length); flere.style.display = "none"; });
      var fa = el("div", "af-actions"); fa.style.cssText = "margin-top:10px;padding-top:0;border:0"; fa.appendChild(flere); boks.appendChild(fa);
    }
    boks.appendChild(detalj);
    return boks;
  }

  // Alle felt i én rad, også de som ikke fikk plass i tabellen. Nestede lister vises som egen tabell.
  var SKJULT_DETALJ = /(^|_)datakilde$|_json$/;

    var feil = el("div", "af-error-summary"); feil.setAttribute("role", "alert"); feil.style.display = "none";
    feil.appendChild(el("h2", null, "Feil")); var feilTekst = el("p"); feil.appendChild(feilTekst); m.appendChild(feil);
    function visFeil(t) { feilTekst.textContent = t || ""; feil.style.display = t ? "" : "none"; }

    var logg = el("div"); logg.setAttribute("aria-live", "polite"); m.appendChild(logg);
    var svarIndeks = 0;
    CHAT.historikk.forEach(function (h) { chatMelding(logg, h.rolle, h.tekst, h.rolle === "assistent" ? CHAT.svar[svarIndeks++] : null); });

    var g = el("div", "af-group"), l = el("label", "af-label", "Spørsmål"), felt = el("textarea", "af-textarea");
    felt.id = "chat-felt"; l.htmlFor = felt.id; felt.rows = 3; felt.disabled = !KI;
    g.appendChild(l); g.appendChild(felt); m.appendChild(g);
    var a = el("div", "af-actions"), send = el("button", "af-btn af-btn-primary", "Send"), ny = el("button", "af-btn af-btn-secondary", "Ny samtale"), status = el("span", "af-save-status");
    send.type = "button"; ny.type = "button"; send.disabled = !KI;
    a.appendChild(send); a.appendChild(ny); a.appendChild(status); m.appendChild(a);
    if (!CHAT.historikk.length) {
      var eksempler = el("details", "af-examples"), ex = el("ul", "af-task-board");
      eksempler.appendChild(el("summary", null, "Forslag til spørsmål"));
      CHAT_FORSLAG.forEach(function (f) {
        var li = el("li"), b = el("button", "af-task-card"); b.type = "button";
        b.appendChild(el("span", null, f));
        b.addEventListener("click", function () { felt.value = f; felt.focus(); });
        li.appendChild(b); ex.appendChild(li);
      });
      eksempler.appendChild(ex); m.appendChild(eksempler);
    }

    function sendNa() {
      var tekst = felt.value.trim(); if (!tekst || !KI) return;
      visFeil("");
      var forslag = m.querySelector(".af-examples");
      if (forslag) forslag.hidden = true;
      CHAT.historikk.push({ rolle: "bruker", tekst: tekst }); chatMelding(logg, "bruker", tekst);
      felt.value = ""; send.disabled = true; status.textContent = "KI-en henter data …";
      post("/api/chat", { meldinger: CHAT.historikk, rolle: aktivRolle || "ukjent rolle" })
        .then(function (s) { CHAT.historikk.push({ rolle: "assistent", tekst: s.tekst }); CHAT.svar.push(s); chatMelding(logg, "assistent", s.tekst, s); chatFasit(s); chatStatus.textContent = "KI tilkoblet · " + KI_MODELL + " · syntetiske øvingsdata"; })
        .catch(function (e) { CHAT.historikk.pop(); logg.removeChild(logg.lastChild); felt.value = tekst; if (forslag) forslag.hidden = false; visFeil(e.message); chatStatus.textContent = "KI svarte ikke · syntetiske øvingsdata"; })
        .then(function () { send.disabled = !KI; status.textContent = ""; felt.focus(); });
    }
    send.addEventListener("click", sendNa);
    felt.addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendNa(); } });
    ny.addEventListener("click", function () { CHAT.historikk = []; CHAT.svar = []; visChat(); });
    chatFasit(CHAT.svar[CHAT.svar.length - 1]);
    if (CHAT.utkast && KI) { felt.value = CHAT.utkast; CHAT.utkast = null; }
    felt.focus({ preventScroll: true });
  }

  // ---------- Vaktrom (oppgave 06) ----------
  // Logikken ligger i vaktrom.js. Markupen hentes fra /vaktrom-innhold, så den finnes ett sted.
  var VAKTROM = { api: null, steg: "vakt", vakt: null, deler: null };
  function hentVaktromMarkup() {
    if (VAKTROM.deler) return Promise.resolve(VAKTROM.deler);
    return fetch("/vaktrom-innhold").then(function (r) { return r.text(); }).then(function (html) {
      var doc = new DOMParser().parseFromString(html, "text/html");
      // Stilene gjelder bare midten av vinduet (#midt), så de ikke påvirker resten av skallet.
      var stil = doc.querySelector("style");
      if (stil && !$("vaktrom-stil")) {
        var s = document.createElement("style"); s.id = "vaktrom-stil";
        s.textContent = stil.textContent.replace(/(^|\})\s*([^{}]+)\{/g, function (m, slutt, sel) {
          return slutt + "\n" + sel.split(",").map(function (x) { return "#midt " + x.trim(); }).join(", ") + " {";
        });
        document.head.appendChild(s);
      }
      // Bare stegene og feilboksen. Mobilmeny og øvingsdata-banner har skallet selv.
      VAKTROM.deler = [].slice.call(doc.querySelector("main").children).filter(function (n) {
        return !n.classList.contains("af-mobile-nav") && !n.classList.contains("af-alert");
      });
      return VAKTROM.deler;
    });
  }
  function lastVaktromSkript() {
    if (window.Vaktrom) return Promise.resolve();
    return new Promise(function (ok, feil) {
      var s = document.createElement("script"); s.src = "/vaktrom.js";
      s.onload = ok; s.onerror = function () { feil(new Error("Fikk ikke lastet vaktrom.js")); };
      document.head.appendChild(s);
    });
  }
  // Stegene ligger i adressen (#flate:vaktrom/kandidater), så tilbake/frem går mellom stegene.
  // onsket: steget adressen ba om. Viser vaktrom.js et annet (f.eks. «Velg vakt først»), erstattes adressen i stedet for å legge til.
  function vaktromSteg(id) {
    VAKTROM.steg = id;
    var maal = "flate:vaktrom/" + id, erstatt = !!VAKTROM.onsket;
    VAKTROM.onsket = null;
    if (valgt !== maal) {
      if (erstatt) location.replace("#" + encodeURIComponent(maal)); else location.hash = encodeURIComponent(maal);
    }
    tegnMeny(); tegnSti();
  }
  function visVaktrom(under) {
    VAKTROM.api = null; VAKTROM.steg = "vakt"; EMNE = "Vaktrom";
    var m = $("midt"); m.textContent = ""; m.appendChild(el("p", "af-task-hint", "Henter vaktrommet …"));
    fasit(null);
    Promise.all([hentVaktromMarkup(), lastVaktromSkript()]).then(function (svar) {
      if ((valgt || "").indexOf("flate:vaktrom") !== 0) return;  // brukeren har gått videre
      m.textContent = "";
      m.appendChild(el("p", "af-caption", "Flate · Vaktrom"));
      svar[0].forEach(function (n) { m.appendChild(document.importNode(n, true)); });
      VAKTROM.api = window.Vaktrom.start({
        rot: m, stegliste: null, mobilvalg: null, navRot: $("meny"),
        rolle: function () { return aktivRolle || "ukjent rolle"; },
        startSteg: (VAKTROM.onsket = under === "utkast" ? "kontakt" : under || "vakt"),
        vedSteg: vaktromSteg,
        vedVakt: function (t) { VAKTROM.vakt = t; },
        vedKall: function (navn, args) { fasit(navn, args, "museum.db, kun lesing" + (VAKTROM.vakt ? ". Vakt: " + VAKTROM.vakt : "")); }
      });
      tegnMeny();
    }).catch(function (e) {
      m.textContent = "";
      var f = el("div", "af-error-summary"); f.setAttribute("role", "alert");
      f.appendChild(el("h2", null, "Vaktrommet kunne ikke åpnes")); f.appendChild(el("p", null, e.message)); m.appendChild(f);
    });
  }

  // ---------- Datakatalog (skjult: nås bare fra «Vis grunnlag» i en rapport) ----------
  function feilMelding(m, tittel, err) {
    var f = el("div", "af-error-summary"); f.setAttribute("role", "alert");
    f.appendChild(el("h2", null, tittel)); f.appendChild(el("p", null, err.message)); m.appendChild(f);
  }
  function visKatalog() {
    var m = tom("Datakatalog", "Alle tabellene i databasen", "Rådata fra museum.db, kun lesing. Velg en tabell for å se de første radene.");
    var ut = el("div"); ut.appendChild(el("p", "af-task-hint", "Henter …")); m.appendChild(ut);
    fasit(null, null, "museum.db, kun lesing");
    hent("/api/katalog").then(function (d) {
      ut.textContent = "";
      ut.appendChild(el("p", "af-hint", antall(d.tabeller.length, "tabell", "tabeller") + ", " + d.totalt_rader.toLocaleString("nb-NO") + " rader."));
      var wrap = el("div", "af-table-wrap"), t = el("table", "af-table"), th = el("thead"), tr = el("tr"), tb = el("tbody");
      ["Tabell", "Rader", "Kolonner"].forEach(function (k) { tr.appendChild(el("th", null, k)); }); th.appendChild(tr);
      d.tabeller.forEach(function (x) {
        var r = el("tr"), c = el("td"), a = el("a", null, x.navn);
        a.href = "#" + encodeURIComponent("katalog/" + x.navn); c.appendChild(a); r.appendChild(c);
        r.appendChild(el("td", null, x.rader.toLocaleString("nb-NO")));
        r.appendChild(el("td", null, String(x.kolonner.length)));
        tb.appendChild(r);
      });
      t.appendChild(th); t.appendChild(tb); wrap.appendChild(t); ut.appendChild(wrap);
    }).catch(function (err) { ut.textContent = ""; feilMelding(ut, "Fant ikke katalogen", err); });
  }
  function visTabell(navn) {
    var m = tom("Datakatalog", navn);
    var tilbake = el("p", "af-hint"), a = el("a", null, "Tilbake til alle tabellene"); a.href = "#katalog"; tilbake.appendChild(a); m.appendChild(tilbake);
    var ut = el("div"); ut.appendChild(el("p", "af-task-hint", "Henter …")); m.appendChild(ut);
    fasit(null, null, "museum.db, tabell " + navn + ", kun lesing");
    hent("/api/katalog?tabell=" + encodeURIComponent(navn)).then(function (d) {
      ut.textContent = "";
      ut.appendChild(el("p", "af-hint", "Viser " + d.rader.length + " av " + d.totalt.toLocaleString("nb-NO") + " rader. Alle kolonner: " + d.kolonner.join(", ") + "."));
      var wrap = el("div", "af-table-wrap"), t = el("table", "af-table"), th = el("thead"), tr = el("tr"), tb = el("tbody");
      d.kolonner.forEach(function (k) { tr.appendChild(el("th", null, k)); }); th.appendChild(tr);
      d.rader.forEach(function (r) {
        var x = el("tr");
        // Rådata: én linje per celle, lange tekster kuttes. Hele tabellen rulles sidelengs i af-table-wrap.
        d.kolonner.forEach(function (k) {
          var v = r[k], s = v === null || v === undefined ? "" : String(v).replace(/\s+/g, " ");
          var td = el("td", null, s.length > 60 ? s.slice(0, 59) + "…" : s); td.style.whiteSpace = "nowrap"; if (s.length > 60) td.title = s.slice(0, 500);
          x.appendChild(td);
        });
        tb.appendChild(x);
      });
      t.appendChild(th); t.appendChild(tb); wrap.appendChild(t); ut.appendChild(wrap);
    }).catch(function (err) { ut.textContent = ""; feilMelding(ut, "Fant ikke tabellen", err); });
  }

  function visFlate(id, under) {
    if (id === "chat") return visChat();
    if (id === "vaktrom") return visVaktrom(under);
    visStart();  // fjernede flater (sok, arbeidsflyt) og ukjente adresser
  }

  // ---------- Brødsmuler (topplinjen i midten) ----------
  // Hver smule er [tekst, adresse]. Siste smule er der du er. «Tilbake» går ett nivå opp.
  function smuler() {
    var v = valgt || "flate:chat", d = v.split("/"), hode = d[0], type = hode.split(":")[0], navn = hode.slice(type.length + 1);
    var under = (d[1] || "").split("?")[0], valgDel = (d[1] || "").split("?")[1] || "";
    var s = [["Hjem", "flate:chat"]];
    if (type === "rolle" && navn) {
      s.push(["Rapporter · " + navn, hode]);
      if (under) {
        var utenRad = valgDel.replace(/(^|&)rad=\d+/, "").replace(/^&/, "");
        s.push([(SPORSMAL[under] || { tekst: under }).tekst, hode + "/" + under + (utenRad ? "?" + utenRad : "")]);
        if (/(^|&)rad=\d+/.test(valgDel)) s.push(["Rad " + (Number(lesValg(valgDel).rad) + 1), v]);
      }
    } else if (hode === "katalog") {
      s.push(["Tabeller", "katalog"]);
      if (d[1]) s.push([d.slice(1).join("/"), v]);
    } else if (type === "arena") {
      s.push(["Arena", "arena"]);
      var o = AREA.omrader.filter(function (x) { return x.id === navn; })[0];
      if (o) s.push([o.navn, hode]);
      if (o && d[1]) s.push([d[1], v]);
    } else if (hode === "flate:vaktrom") {
      s.push(["Vaktrom", "flate:vaktrom"]);
      var st = VAKTROM.api && d[1] ? VAKTROM.api.steg.filter(function (x) { return x[0] === d[1]; })[0] : null;
      if (st) s.push([st[1], v]);
    }
    return s;
  }
  function tegnSti() {
    var nav = $("sti"), s = smuler(); nav.textContent = "";
    if (s.length < 2) { nav.style.display = "none"; return; }  // På Hjem trengs ingen sti.
    nav.style.display = "";
    var forelder = s[s.length - 2];
    var tilbake = el("button", "af-btn af-btn-secondary", "← Tilbake"); tilbake.type = "button";
    tilbake.style.cssText = "min-height:34px;padding:5px 12px";
    tilbake.setAttribute("aria-label", "Tilbake til " + forelder[0]);
    tilbake.addEventListener("click", function () { vis(forelder[1]); });
    nav.appendChild(tilbake);
    s.forEach(function (x, i) {
      if (i) nav.appendChild(el("span", null, "›")).setAttribute("aria-hidden", "true");
      if (i === s.length - 1) { var naa = el("span", null, x[0]); naa.setAttribute("aria-current", "page"); naa.style.fontWeight = "700"; nav.appendChild(naa); }
      else { var a = el("a", null, x[0]); a.href = "#" + encodeURIComponent(x[1]); nav.appendChild(a); }
    });
  }

  // ---------- Ruting (lenkbar: #rolle:HR og bemanning/vaktplan?dato=2026-11-14&rad=2) ----------
  function vis(id) { if (id && location.hash.slice(1) !== encodeURIComponent(id)) { location.hash = encodeURIComponent(id); return; } ruter(); }
  function ruter() {
    var forrige = valgt;
    valgt = decodeURIComponent(location.hash.slice(1)) || null;
    var deler = (valgt || "").split("/"), hode = deler[0], type = hode.split(":")[0], navn = hode.slice(type.length + 1);
    // Bytte av steg inne i et åpent vaktrom: ikke last vaktrommet på nytt, bare gå til steget.
    if (hode === "flate:vaktrom" && VAKTROM.api && (forrige || "").indexOf("flate:vaktrom") === 0) {
      if (deler[1] && deler[1] !== VAKTROM.steg) { VAKTROM.onsket = deler[1]; VAKTROM.api.gaa(deler[1]); }
      tegnMeny(); tegnSti(); return;
    }
    if (type === "rolle" && rolle(navn)) husk(navn);
    if (type === "rolle" && deler[1]) { var q = deler[1].split("?"); visSporsmal(navn, q[0], lesValg(q[1])); }
    else if (type === "rolle") visRolle(navn);
    else if (type === "arena" && deler[1]) visCase(navn, deler[1]);
    else if (type === "arena" && navn) visArena(navn);
    else if (hode === "arena") visArenaOversikt();
    else if (type === "flate") visFlate(navn, deler[1]);
    else if (hode === "katalog" && deler[1]) visTabell(deler.slice(1).join("/"));
    else if (hode === "katalog") visKatalog();
    else if (aktivRolle) visChat();
    else visStart();
    tegnMeny(); tegnSti();
  }
  window.addEventListener("hashchange", ruter);

  // ---------- Oppstart ----------
  Promise.all([
    hent("/api/status").catch(function () { return {}; }),
    hent("/api/verktoy?navn=list_roles"),
    hent("/api/verktoyskjema"),
    hent("/api/arena/caser").catch(function () { return { omrader: [], caser: [] }; })
  ]).then(function (d) {
    KI = !!d[0].llm;
    KI_MODELL = d[0].llm_modell || "";
    $("f-ki").textContent = KI ? "På (" + d[0].llm_modell + "). KI-svar merkes AI-forslag til en person har godtatt dem." : "Av. Alle svar er hentet rett fra databasen.";
    ROLLER = d[1].resultat || [];
    SPORSMAL = d[2].sporsmal || {};
    (d[2].verktoy || []).forEach(function (v) { SKJEMA[v.navn] = v; });
    AREA = d[3];
    ruter();
  }).catch(function (e) {
    $("meny").textContent = ""; $("midt").textContent = "";
    var f = el("div", "af-error-summary"); f.setAttribute("role", "alert");
    f.appendChild(el("h2", null, "Datafinner svarer ikke")); f.appendChild(el("p", null, e.message)); $("midt").appendChild(f);
  });
})();
</script>
