<style>
/* Storskjerm: én skjerm 16:9, lesbar fra tre meter. Arbeidsflyt-tokens (én lys palett, med vilje),
   status som ord, én blå for handling. Oppsett C «Én ting om gangen» (DECISIONS SC1–SC6): topp, fire
   nøkkeltall som står fast, og én stor flate som bytter mellom Besøk, Frister, Utstillinger og Vet ikke.
   «Vis underlaget» åpner radene bak flaten. */
:root { --ss-bg: #f3f6f8; --ss-ink: #172b3b; color-scheme: light; }
html { height: 100%; font-size: clamp(14px, min(1.15vw, 2.05vh), 30px); }  /* følger bredde og høyde, så alt får plass også i et lavt vindu */
body { height: 100%; margin: 0; background: var(--ss-bg); color: var(--ss-ink);
  font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
.ss { box-sizing: border-box; height: 100%; display: grid; gap: 0.8rem;
  grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr);
  padding-block: 0.8rem; padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--canvas); color: var(--ink); }
.ss *, .ss *::before, .ss *::after { box-sizing: border-box; }
.ss [hidden] { display: none !important; }  /* ellers vinner display: flex over hidden, og alle flatene vises samtidig */

.ss-topp { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem 1.4rem;
  background: var(--topbar); color: var(--topbar-ink); border-radius: var(--radius-card); padding: 0.7rem 1.1rem; }
.ss-navn { font-size: 1.35rem; font-weight: 700; margin: 0; }
.ss-dag { font-size: 1.1rem; font-weight: 600; }
.ss-per { font-size: 0.95rem; color: var(--topbar-muted); }
.ss-obs { margin-left: auto; font-size: 1rem; font-weight: 700; border-radius: var(--radius-pill);
  padding: 0.25rem 0.9rem; background: var(--gold-soft); color: var(--gold); }
.ss-obs[data-null] { background: var(--green-soft); color: var(--green-ink); }
.ss-knapp { font: inherit; font-size: 0.95rem; font-weight: 600; color: var(--topbar); background: var(--topbar-ink);
  border: 0; border-radius: var(--radius-field); padding: 0.35rem 0.9rem; cursor: pointer; }
.ss-knapp:hover { background: var(--blue-soft); }
.ss :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

/* De fire nøkkeltallene står fast. Et trykk på ett av dem hopper til flaten det hører til. */
.ss-flater, .ss-scene { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-card); min-width: 0; }
.ss-flater { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); overflow: hidden; }
.ss-flate { display: grid; gap: 0.2rem; align-content: start; padding: 0.6rem 1rem; min-width: 0; cursor: pointer; }
.ss-flate + .ss-flate { border-left: 1px solid var(--line); }
.ss-flate:hover { background: var(--blue-soft); }
.ss-etikett { font-size: 0.95rem; font-weight: 600; color: var(--muted); margin: 0; }
.ss-tall { font-size: 2.1rem; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; }
.ss-enhet { font-size: 1rem; font-weight: 600; color: var(--muted); margin-left: 0.3rem; }
.ss-linje { font-size: 0.92rem; color: var(--ink); }
.ss-kilde { font-size: 0.92rem; color: var(--muted); }
.ss-rad { display: flex; flex-wrap: wrap; align-items: center; gap: 0.3rem 0.7rem; }
.ss-status { font-size: 0.92rem; font-weight: 700; border-radius: var(--radius-pill); padding: 0.1rem 0.7rem; }
.ss-status[data-s="Normal"] { background: var(--green-soft); color: var(--green-ink); }
.ss-status[data-s="Følg med"] { background: var(--gold-soft); color: var(--gold); }
.ss-status[data-s="Over terskel"] { background: var(--danger-soft); color: var(--danger); }
.ss-status[data-s="Ukjent"], .ss-status[data-s="Stengt"] { background: var(--neutral-soft); color: var(--neutral-ink); }

/* Den store flaten: faner øverst, så én flate. Hver flate har en oversikt og et underlag. */
.ss-scene { display: flex; flex-direction: column; gap: 0.7rem; min-height: 0; padding: 0.9rem 1.4rem 1.1rem; }
.ss-faner { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
.ss-fane { font: inherit; font-size: 0.95rem; font-weight: 600; cursor: pointer; border: 1px solid var(--button-border);
  background: var(--paper); color: var(--neutral-ink); border-radius: var(--radius-pill); padding: 0.25rem 1rem; }
.ss-fane[aria-pressed="true"] { background: var(--topbar); border-color: var(--topbar); color: var(--topbar-ink); }
.ss-dypere { margin-left: auto; border-color: var(--blue); background: var(--blue); color: #fff; }
.ss-dypere[aria-pressed="true"] { background: var(--paper); color: var(--blue); }
.ss-pause { border-style: dashed; }
.ss-felt, .ss-visning { flex: 1; min-height: 0; min-width: 0; display: flex; flex-direction: column; gap: 0.6rem; }
.ss-felt h2 { font-size: 1.6rem; font-weight: 700; letter-spacing: -.01em; margin: 0; }
.ss-fhode { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 0.1rem 1.2rem; }
.ss-tegning { flex: 1; min-height: 0; position: relative; }
.ss-tegning svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.ss-tegning text { font-family: inherit; font-size: 1rem; fill: var(--muted); }
.ss-tegning .ss-verdi { fill: var(--ink); font-weight: 700; }

.ss-hode { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.2rem 0.9rem; }
.ss-stort { font-size: 4.2rem; font-weight: 700; line-height: 0.95; font-variant-numeric: tabular-nums; color: var(--green-ink); }
#frister[data-forfalt] .ss-stort { color: var(--danger); }
.ss-over { font-weight: 700; color: var(--danger); }
.ss-tre { display: flex; flex-wrap: wrap; gap: 0.2rem 1.4rem; font-size: 1rem; color: var(--muted); }
.ss-tre b { font-size: 1.3rem; color: var(--ink); font-variant-numeric: tabular-nums; }
.ss-liste { list-style: none; margin: 0; padding: 0; display: grid; }
.ss-liste li { font-size: 1.25rem; line-height: 1.3; padding: 0.45rem 0; border-top: 1px solid var(--line); }
#frister .ss-liste li { font-weight: 600; }
.ss-liste small { display: block; font-size: 1rem; font-weight: 400; color: var(--muted); }
.ss-tabeller { color: var(--muted); }

.ss-stolper { flex: 1; min-height: 0; display: grid; align-content: start; gap: 0.55rem; }
.ss-stolpe { display: grid; grid-template-columns: minmax(0, 24rem) minmax(0, 1fr) auto; align-items: center; gap: 1rem;
  font-size: 1.15rem; }
.ss-stolpe span:first-child { overflow-wrap: anywhere; }
.ss-spor { height: 1rem; background: var(--track); border-radius: 3px; overflow: hidden; }
.ss-spor i { display: block; height: 100%; background: var(--blue); }
.ss-stolpe b { font-variant-numeric: tabular-nums; text-align: right; }

/* Underlaget: radene bak flaten. Ruller inne i feltet hvis det er mange rader. */
.ss-rull { flex: 1; min-height: 0; overflow: auto; }
.ss-tab { width: 100%; border-collapse: collapse; font-size: 1.1rem; }
.ss-tab th { text-align: left; font-size: 0.92rem; font-weight: 600; color: var(--muted); white-space: nowrap;
  padding: 0.35rem 1rem 0.35rem 0; border-bottom: 2px solid var(--line); position: sticky; top: 0; background: var(--paper); }
.ss-tab td { padding: 0.45rem 1rem 0.45rem 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.ss-tab .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

.ss-feil { background: var(--danger-soft); color: var(--danger); border-radius: var(--radius-card);
  padding: 1.2rem; font-size: 1.2rem; font-weight: 600; }

@media (max-width: 900px) {
  html { font-size: 16px; }
  body, .ss { height: auto; }
  .ss { grid-template-rows: none; }
  .ss-flater { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ss-flate:nth-child(3) { border-left: 0; }
  .ss-flate:nth-child(n+3) { border-top: 1px solid var(--line); }
  .ss-tegning { flex: none; height: 14rem; }
  .ss-obs, .ss-dypere { margin-left: 0; }
  .ss-scene { padding-inline: 0.9rem; }
}
@media (max-width: 480px) {
  .ss-flater { grid-template-columns: minmax(0, 1fr); }
  .ss-flate + .ss-flate { border-left: 0; border-top: 1px solid var(--line); }
  .ss-stolpe { grid-template-columns: minmax(0, 1fr) auto; } .ss-spor { grid-column: 1 / -1; grid-row: 2; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<main class="af ss"></main>

<script>
(function () {
  "use strict";
  var main = document.querySelector("main");
  var NB = new Intl.NumberFormat("nb-NO", { maximumFractionDigits: 2 });
  var SVG = "http://www.w3.org/2000/svg";
  var VIS_FRISTER = 4;  // flere får ikke plass på storskjerm; resten telles og står i underlaget
  var BYTT_MS = 12000;   // så lenge står hver flate før neste vises
  var TIL_FLATE = { besok: "besok-uker", besok_uke: "besok-uker", saker: "frister", tilfredshet: "hull" };

  function el(tag, cls, tekst) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (tekst !== undefined && tekst !== null) e.textContent = String(tekst);
    return e;
  }
  function tall(v) { return v === null || v === undefined ? "–" : NB.format(v); }
  function dm(iso) { var d = String(iso || "").split("-"); return d.length === 3 ? d[2] + "." + d[1] : String(iso || ""); }
  function periode(t) { return String(t || "").split("–").map(dm).join("–"); }
  function kilde(t) { return el("div", "ss-kilde", "Kilde: " + t); }
  function dagerMellom(fra, til) { return Math.round((new Date(til) - new Date(fra)) / 864e5); }
  function tabell(hoder, rader, tallKol) {
    var t = el("table", "ss-tab"), thead = el("thead"), hr = el("tr"), tb = el("tbody");
    hoder.forEach(function (x, i) { hr.appendChild(el("th", tallKol.indexOf(i) >= 0 ? "num" : null, x)); });
    thead.appendChild(hr); t.appendChild(thead);
    rader.forEach(function (r) {
      var tr = el("tr");
      r.forEach(function (c, i) { tr.appendChild(el("td", tallKol.indexOf(i) >= 0 ? "num" : null, c)); });
      tb.appendChild(tr);
    });
    t.appendChild(tb);
    var rull = el("div", "ss-rull"); rull.tabIndex = 0; rull.appendChild(t);
    return rull;
  }
  // Hver flate er en seksjon med to visninger: oversikten (o) og underlaget (u). Bare én vises om gangen.
  function felt(id, fane) {
    var s = el("section", "ss-felt"); s.id = id; s.hidden = true;
    s._fane = fane;
    s.o = el("div", "ss-visning"); s.u = el("div", "ss-visning"); s.u.hidden = true;
    s.appendChild(s.o); s.appendChild(s.u);
    return s;
  }
  function hode(tittel, kildeTekst) {
    var h = el("div", "ss-fhode");
    h.appendChild(el("h2", null, tittel));
    h.appendChild(kilde(kildeTekst));
    return h;
  }

  function topp(d) {
    var h = el("header", "ss-topp");
    h.appendChild(el("h1", "ss-navn", "Kunstpixel"));
    var dag = new Date(d.dato + "T12:00:00").toLocaleDateString("nb-NO",
      { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    h.appendChild(el("span", "ss-dag", dag.charAt(0).toUpperCase() + dag.slice(1) + (d.aapent_i_dag === false ? " · stengt" : "")));
    h.appendChild(el("span", "ss-per", "Tall per " + dm(d.dato) + " kl. " + d.hentet_kl));
    var obs = el("span", "ss-obs", d.oppmerksomhet + " krever oppmerksomhet");
    if (!d.oppmerksomhet) obs.setAttribute("data-null", "");
    h.appendChild(obs);
    if (document.fullscreenEnabled) {
      var k = el("button", "ss-knapp", "Fullskjerm"); k.type = "button"; k.id = "fullskjerm";
      k.addEventListener("click", function () {
        var p = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
        if (p && p.catch) p.catch(function () { k.hidden = true; });
      });
      document.addEventListener("fullscreenchange", function () {
        k.textContent = document.fullscreenElement ? "Lukk fullskjerm" : "Fullskjerm";
      });
      h.appendChild(k);
    }
    return h;
  }

  function flate(f) {
    var s = el("section", "ss-flate"); s.id = "flate-" + f.id;
    s.appendChild(el("h2", "ss-etikett", f.navn + " · " + (String(f.gjelder).indexOf("–") > 0 ? "" : "gjelder ") + periode(f.gjelder)));
    var rad = el("div", "ss-rad");
    var t = el("div", "ss-tall", tall(f.verdi));
    if (f.verdi !== null && f.verdi !== undefined) t.appendChild(el("span", "ss-enhet", f.enhet));
    rad.appendChild(t);
    if (f.status) { var st = el("span", "ss-status", f.status); st.setAttribute("data-s", f.status); rad.appendChild(st); }
    s.appendChild(rad);
    s.appendChild(el("div", "ss-linje", f.sammenligning));
    s.appendChild(kilde(f.kilde));
    return s;
  }

  function linjediagram(boks, uker) {
    function tegn() {
      while (boks.firstChild) boks.removeChild(boks.firstChild);
      var w = boks.clientWidth, h = boks.clientHeight;
      if (w < 50 || h < 50) return;
      var rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
      var v = { l: 3.8 * rem, r: 7 * rem, t: 1.2 * rem, b: 2 * rem };
      var maks = 0;
      uker.forEach(function (u) { maks = Math.max(maks, u.i_aar || 0, u.i_fjor || 0); });
      var steg = Math.pow(10, Math.floor(Math.log10(maks || 1)));
      var topp = Math.ceil((maks || 1) / steg) * steg;
      var x = function (i) { return v.l + i * (w - v.l - v.r) / Math.max(uker.length - 1, 1); };
      var y = function (n) { return h - v.b - n / topp * (h - v.t - v.b); };
      var svg = document.createElementNS(SVG, "svg");
      svg.setAttribute("role", "img");
      svg.setAttribute("aria-label", "Besøk per uke, i år mot i fjor");
      function ny(tag, attr, tekst) {
        var e = document.createElementNS(SVG, tag);
        Object.keys(attr).forEach(function (k) { e.setAttribute(k, attr[k]); });
        if (tekst !== undefined) e.textContent = tekst;
        svg.appendChild(e); return e;
      }
      [0, topp / 2, topp].forEach(function (n) {
        ny("line", { x1: v.l, x2: w - v.r, y1: y(n), y2: y(n), stroke: "var(--line)", "stroke-width": 1 });
        ny("text", { x: v.l - 0.4 * rem, y: y(n) + 0.3 * rem, "text-anchor": "end" }, tall(n));
      });
      // Smal skjerm: vis bare hver n-te uke, så navnene ikke overlapper. Siste uke vises alltid.
      var hvert = Math.max(1, Math.ceil(4.6 * rem / Math.max(x(1) - x(0), 1)));
      uker.forEach(function (u, i) {
        var siste = i === uker.length - 1;
        if (!siste && ((uker.length - 1 - i) % hvert !== 0)) return;
        ny("text", { x: x(i), y: h - 0.4 * rem, "text-anchor": "middle" }, "uke " + u.uke);
      });
      [["i_fjor", "var(--muted)", "I fjor"], ["i_aar", "var(--blue)", "I år"]].forEach(function (s) {
        var pkt = uker.map(function (u, i) { return u[s[0]] === null ? null : [x(i), y(u[s[0]])]; }).filter(Boolean);
        if (!pkt.length) return;
        ny("polyline", { points: pkt.map(function (p) { return p.join(","); }).join(" "), fill: "none", stroke: s[1],
          "stroke-width": s[0] === "i_aar" ? 4 : 3, "stroke-dasharray": s[0] === "i_fjor" ? "8 6" : "none" });
        var sist = pkt[pkt.length - 1];
        var u = uker[uker.length - 1];
        // Den høyeste av de to siste verdiene får etiketten over punktet, den andre under, så de ikke overlapper.
        var over = s[0] === "i_aar" ? (u.i_aar || 0) >= (u.i_fjor || 0) : (u.i_fjor || 0) > (u.i_aar || 0);
        ny("circle", { cx: sist[0], cy: sist[1], r: 6, fill: s[1] });
        ny("text", { x: sist[0] + 0.6 * rem, y: sist[1] + (over ? -0.35 : 1.0) * rem,
          "class": s[0] === "i_aar" ? "ss-verdi" : "" }, s[2] + " " + tall(u[s[0]]));
      });
      boks.appendChild(svg);
    }
    tegn();
    if (window.ResizeObserver) new ResizeObserver(tegn).observe(boks);  // tegner også når flaten blir synlig igjen
  }

  function besokUker(d) {
    var s = felt("besok-uker", "Besøk");
    s.o.appendChild(hode("Besøk siste 8 uker", "dagsbesok. Hele uker, uten uka som pågår."));
    var b = el("div", "ss-tegning");
    s.o.appendChild(b);
    s.u.appendChild(hode("Underlag: besøk per uke", "dagsbesok"));
    s.u.appendChild(tabell(["Uke", "Dager", "I år", "Samme uke i fjor", "Endring"], d.besok_uker.map(function (u) {
      var e = "–";
      if (u.i_aar !== null && u.i_fjor) {
        var p = (u.i_aar - u.i_fjor) / u.i_fjor * 100;
        e = (p > 0 ? "+" : p < 0 ? "−" : "") + NB.format(Math.abs(Math.round(p * 10) / 10)) + " %";
      }
      return ["uke " + u.uke, dm(u.fra) + "–" + dm(u.til), tall(u.i_aar), tall(u.i_fjor), e];
    }), [2, 3, 4]));
    s._tegn = function () { linjediagram(b, d.besok_uker); };
    return s;
  }

  function fristFelt(d) {
    var f = d.frister;
    var kilder = [];
    f.rader.forEach(function (r) { if (r.kilde && kilder.indexOf(r.kilde) < 0) kilder.push(r.kilde); });
    var kildeTekst = kilder.length ? kilder.join(", ") : "driftsmeldinger, avvik_hms_drift, h5_rapporteringskalender";
    var s = felt("frister", "Frister");
    // Det som haster står størst: antall forfalte som stort tall, og hver frist med hvor lenge den har ligget.
    var forfalt = f.antall.Forfalt || 0;
    if (forfalt) s.setAttribute("data-forfalt", "");
    var h = el("div", "ss-hode");
    h.appendChild(el("span", "ss-stort", forfalt ? forfalt : "Ingen"));
    h.appendChild(el("h2", null, forfalt === 1 ? "frist er forfalt" : "frister er forfalt"));
    s.o.appendChild(h);
    var tre = el("div", "ss-tre");
    ["I dag", "Denne uka"].forEach(function (g) {
      var b = el("span"); b.appendChild(el("b", null, f.antall[g] ? f.antall[g] : "Ingen"));
      b.appendChild(document.createTextNode(" " + g.toLowerCase())); tre.appendChild(b);
    });
    s.o.appendChild(tre);
    var naa = f.rader.filter(function (r) { return r.gruppe !== "Senere"; });
    var ul = el("ul", "ss-liste");
    naa.slice(0, VIS_FRISTER).forEach(function (r) {
      var li = el("li", null, r.tittel), sm = el("small");
      var over = dagerMellom(r.frist_dato, d.dato);
      if (r.gruppe === "Forfalt" && over > 0) {
        sm.appendChild(el("span", "ss-over", over + (over === 1 ? " dag over" : " dager over")));
        sm.appendChild(document.createTextNode(" · "));
      }
      sm.appendChild(document.createTextNode("frist " + dm(r.frist_dato) + " · " + r.ref));
      li.appendChild(sm);
      ul.appendChild(li);
    });
    if (!naa.length) ul.appendChild(el("li", null, "Ingen frister forfalt, i dag eller denne uka."));
    s.o.appendChild(ul);
    var mer = [];
    if (naa.length > VIS_FRISTER) mer.push((naa.length - VIS_FRISTER) + " til");
    if (f.antall.Senere) mer.push(f.antall.Senere + " senere");
    if (f.skjult) mer.push(f.skjult + " innlån skjult");
    s.o.appendChild(el("div", "ss-kilde", (mer.length ? mer.join(" · ") + " · " : "") + "Kilde: " + kildeTekst));

    s.u.appendChild(hode("Underlag: alle frister", kildeTekst));
    s.u.appendChild(tabell(["Frist", "Status", "Sak", "Referanse"], f.rader.map(function (r) {
      var om = dagerMellom(d.dato, r.frist_dato);
      var st = om < 0 ? (-om) + (om === -1 ? " dag over" : " dager over") : om === 0 ? "i dag" : "om " + om + (om === 1 ? " dag" : " dager");
      return [dm(r.frist_dato), st, r.tittel, r.ref];
    }), []));
    if (!f.rader.length) s.u.appendChild(el("div", "ss-linje", "Ingen frister."));
    return s;
  }

  function utstillinger(d) {
    var kildeTekst = "utstillinger_historikk og utstilling_okonomi";
    var s = felt("utstillinger", "Utstillinger");
    s.o.appendChild(hode("Utstillingene i år: netto resultat", kildeTekst));
    var maks = 0;
    d.utstillinger.forEach(function (u) { maks = Math.max(maks, Math.abs(u.netto_resultat_nok || 0)); });
    var boks = el("div", "ss-stolper");
    d.utstillinger.forEach(function (u) {
      var navn = String(u.tittel).replace(/\s*\(\d{4}\)\s*$/, "").split(":")[0];
      var r = el("div", "ss-stolpe");
      r.appendChild(el("span", null, navn + " · " + u.sesong));
      var spor = el("div", "ss-spor"), fyll = el("i");

<script>
/* Felles: databasen i minnet og knappene i toppen. Knappene settes inn når storskjermen har tegnet toppen. */
(function () {
  "use strict";
  var CDN = "https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.12.0/";
  var laster = null;
  window.kp = { db: null, instruks: null, steg: "", feil: null, start: 0, slutt: 0, lyttere: [] };
  function melde() { window.kp.lyttere.forEach(function (f) { try { f(); } catch (e) {} }); }
  function steg(t) { window.kp.steg = t; melde(); }
  function lastSkript(src) {
    return new Promise(function (ja, nei) {
      var s = document.createElement("script"); s.src = src; s.onload = ja;
      s.onerror = function () { nei(new Error("kunne ikke laste " + src)); }; document.head.appendChild(s);
    });
  }
  function frist(p, ms, hva) {
    return Promise.race([p, new Promise(function (_, nei) {
      setTimeout(function () { nei(new Error(hva + " tok over " + ms / 1000 + " s")); }, ms); })]);
  }
  // Lastes første gang en skuff åpnes, ikke når siden åpnes: ca. 4 MB og en SQL-motor fra cdnjs.
  window.kp.last = function () {
    if (laster) return laster;
    window.kp.start = performance.now();
    var tikk = setInterval(melde, 1000);
    laster = (async function () {
      var SQL, motor = "rask";
      var dbTekst = fetch("museum.db.gz.txt").then(function (r) { if (!r.ok) throw new Error("databasen: HTTP " + r.status); return r.text(); });
      var instTekst = fetch("chat-instruks.txt").then(function (r) { if (!r.ok) throw new Error("instruksen: HTTP " + r.status); return r.text(); });
      dbTekst.catch(function () {}); instTekst.catch(function () {});
      steg("1/4 Laster SQL-motoren");
      try {
        await frist(lastSkript(CDN + "sql-wasm.min.js"), 10000, "SQL-motoren");
        SQL = await frist(initSqlJs({ locateFile: function (f) { return CDN + f; } }), 10000, "SQL-motoren");
      } catch (e) {
        // claude.ai kan stoppe WebAssembly. Da brukes den rene JavaScript-utgaven: tregere, samme SQL.
        motor = "reserve"; steg("1/4 Laster reserve-motoren"); window.initSqlJs = undefined;
        await frist(lastSkript(CDN + "sql-asm-memory-growth.min.js"), 30000, "Reserve-motoren"); SQL = await initSqlJs();
      }
      steg("2/4 Henter databasen (motor: " + motor + ")");
      var b64 = (await frist(dbTekst, 60000, "Henting av databasen")).trim();
      steg("3/4 Pakker ut databasen");
      var bin = atob(b64), u = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
      var ut = new Blob([u]).stream().pipeThrough(new DecompressionStream("gzip"));
      var raa = new Uint8Array(await new Response(ut).arrayBuffer());
      steg("4/4 Åpner databasen");
      var db = new SQL.Database(raa);
      db.exec("PRAGMA query_only = ON");
      window.kp.instruks = await frist(instTekst, 30000, "Henting av instruksen");
      window.kp.db = db;
      steg("Klar, motor: " + motor);
    })();
    laster.catch(function (e) { window.kp.feil = (e && e.message) || String(e); })
      .then(function () { window.kp.slutt = performance.now(); clearInterval(tikk); melde(); });
    return laster;

  window.kp.knapp = function (id, tekst, klikk) {
    var h = document.querySelector("header.ss-topp");
    if (!h || document.getElementById(id)) return;
    var b = document.createElement("button");
    b.className = "ss-knapp"; b.type = "button"; b.id = id; b.textContent = tekst; b.onclick = klikk;
    var fs = document.getElementById("fullskjerm");

    });

    document.querySelectorAll(".sk-skuff[data-apen]").forEach(function (s) { s.removeAttribute("data-apen"); });
  };
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") window.kp.lukkAlle(); });

<script>
/* KI-chat. Hvert spørsmål sendes med instruksen og samtalen så langt. Claude henter tall med verktøyet sql,
   som kjører i siden mot databasen i minnet. All tekst tegnes med textContent (ingen markdown, ingen HTML). */
(function () {
  "use strict";
  var NB = new Intl.NumberFormat("nb-NO", { maximumFractionDigits: 2 });
  var skuff = document.getElementById("skuff"), logg = document.getElementById("logg"), felt = document.getElementById("felt");
  var sendKnapp = document.getElementById("send");
  var sample = null, turer = [], opptatt = false;
  var FORSLAG = ["Hva krever oppmerksomhet i dag?", "Hvordan går utstillingene i år?",
    "Hvordan var besøket forrige uke?", "Hvordan gikk Fokusrommet i år?"];

  function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = String(x); return e; }
  function rull() { logg.scrollTop = logg.scrollHeight; }
  // Kolonnen står alltid. Databasen lastes først når noen begynner å skrive eller trykker et forslag.
  function klargjor() { window.kp.last(); visSteg(); }
  felt.addEventListener("focus", klargjor);

  function visSteg() {
    var s = document.getElementById("status"); if (!s || !window.kp.start) return;
    var sek = Math.round(((window.kp.slutt || performance.now()) - window.kp.start) / 1000);
    if (window.kp.feil) { s.className = "sk-status sk-feil"; s.textContent = "Fikk ikke lastet databasen. Steg: " + window.kp.steg + ". Feil: " + window.kp.feil; }
    else if (window.kp.db) s.textContent = "Klar. Trykk et forslag eller skriv selv. (" + window.kp.steg + ", " + sek + " s)";
    else s.textContent = "Laster … " + window.kp.steg + " (" + sek + " s)";
  }
  window.kp.lyttere.push(visSteg);

  // Samme regel som sql.py: én SELECT eller WITH, maks 200 rader, svar på maks ca. 30 KB.
  function kjorSql(q, sqlLogg) {
    q = String(q || "").trim().replace(/;\s*$/, "");
    if (!/^(select|with)\b/i.test(q) || q.indexOf(";") >= 0) throw new Error("Bare én SELECT eller WITH er lov.");
    sqlLogg.push(q);
    var r = window.kp.db.exec(q)[0] || { columns: [], values: [] };
    var ut = { kolonner: r.columns, antall: r.values.length, rader: r.values.slice(0, 200), avkortet: r.values.length > 200 };
    while (JSON.stringify(ut).length > 30000 && ut.rader.length > 5) { ut.rader = ut.rader.slice(0, Math.floor(ut.rader.length / 2)); ut.avkortet = true; }
    return ut;
  }

  // Linjene DIAGRAM: og VALG: tas ut av teksten og tegnes for seg. En ugyldig linje vises ikke og gir ingen feil.
  function del(tekst) {
    var rest = [], diagram = null, valg = null;
    String(tekst || "").split("\n").forEach(function (l) {
      var t = l.trim();
      if (/^DIAGRAM:/.test(t)) { try { diagram = JSON.parse(t.slice(8)); } catch (e) {} return; }
      if (/^VALG:/.test(t)) { try { valg = JSON.parse(t.slice(5)); } catch (e) {} return; }
      rest.push(l);
    });

  }

  function stolper(d) {
    if (!d || !Array.isArray(d.etiketter) || !Array.isArray(d.verdier)) return null;
    var n = Math.min(d.etiketter.length, d.verdier.length, 12); if (!n) return null;
    var v = d.verdier.slice(0, n).map(Number), maks = Math.max.apply(null, v.map(function (x) { return Math.abs(x) || 0; })) || 1;
    var boks = el("div", "sk-diagram");
    if (d.tittel) boks.appendChild(el("div", "ss-etikett", d.tittel));
    for (var i = 0; i < n; i++) {
      var rad = el("div", "ss-stolpe"); rad.appendChild(el("span", null, d.etiketter[i]));
      var spor = el("div", "ss-spor"), fyll = el("i"); fyll.style.width = (Math.max(0, v[i] || 0) / maks * 100) + "%";
      if (v[i] < 0) fyll.style.background = "var(--danger)";
      spor.appendChild(fyll); rad.appendChild(spor);
      rad.appendChild(el("b", null, (isFinite(v[i]) ? NB.format(v[i]) : "–") + (d.enhet ? " " + d.enhet : ""))); boks.appendChild(rad);
    }
    return boks;
  }

  var FEIL = { not_granted: "Siden fikk ikke lov til å bruke Claude. Last siden på nytt og trykk Tillat.",
    rate_limited: "For mange spørsmål akkurat nå. Vent litt og prøv igjen.",
    tools_unavailable: "KI-chat kan ikke kjøre SQL her. Åpne siden i claude.ai i nettleseren.",
    session_expired: "Du må logge inn på nytt i claude.ai.",
    prompt_too_large: "Samtalen ble for lang. Last siden på nytt for å starte en ny.",
    refused: "Claude ville ikke svare på dette. Spør på en annen måte.",
    sampling_disabled: "Claude er ikke tilgjengelig for denne kontoen." };

  async function spor(q) {
    if (opptatt || !q) return;
    var st = document.getElementById("status"); if (st) st.remove();
    logg.appendChild(el("div", "sk-du", q));
    var b = el("div", "sk-claude"), tekstEl = el("div", "sk-tekst sk-tenker", "Tenker … henter tall med SQL");
    var stopp = el("button", "sk-chip", "Stopp"); stopp.type = "button";
    b.appendChild(tekstEl); b.appendChild(stopp); logg.appendChild(b); rull();
    opptatt = true; sendKnapp.disabled = true;
    var sqlLogg = [], ctl = new AbortController();
    stopp.onclick = function () { ctl.abort(); };
    try {
      await window.kp.last();
      if (!window.kp.db) throw { code: "ingen_db" };
      turer.push({ role: "user", content: q });
      var meldinger = [{ role: "user", content: window.kp.instruks }].concat(turer.slice(-20));
      var svar = await sample(meldinger, { signal: ctl.signal,
        onText: function (u) { tekstEl.className = "sk-tekst"; tekstEl.textContent = del(u.text).tekst; rull(); },
        tools: [{ name: "sql",
          description: "Kjører én lesende SQLite-spørring (SELECT eller WITH) mot hele museum.db. Returnerer kolonner, antall, rader (maks 200) og om svaret ble kuttet.",
          inputSchema: { type: "object", properties: { sporring: { type: "string", description: "Én SELECT- eller WITH-spørring" } }, required: ["sporring"] },
          execute: function (inp) { tekstEl.textContent = "Henter tall med SQL (" + (sqlLogg.length + 1) + ") …"; return kjorSql(inp && inp.sporring, sqlLogg); } }] });
      turer.push({ role: "assistant", content: svar.text });
      vis(b, tekstEl, stopp, svar.text, sqlLogg, svar.truncated);
    } catch (e) {
      stopp.remove();
      var kode = e && e.code;
      if (kode === "cancelled") { tekstEl.className = "sk-tekst"; tekstEl.textContent = (e.text ? del(e.text).tekst + "\n" : "") + "Stoppet."; }
      else if (kode === "ingen_db") { tekstEl.className = "sk-tekst sk-feil"; tekstEl.textContent = "Fikk ikke lastet databasen: " + window.kp.feil; }
      else {
        tekstEl.className = "sk-tekst sk-feil";
        tekstEl.textContent = (e && e.text ? del(e.text).tekst + "\n\n" : "") + (FEIL[kode] || ("Noe gikk galt (" + (kode || (e && e.message) || "ukjent") + "). Prøv igjen."));
        if (kode === "not_granted" || kode === "sampling_disabled") skjulChat();
      }
      if (turer.length && turer[turer.length - 1].role === "user") turer.pop();
    } finally { opptatt = false; sendKnapp.disabled = false; rull(); }
  }

  function vis(b, tekstEl, stopp, tekst, sqlLogg, avkortet) {
    stopp.remove();
    var d = del(tekst);
    tekstEl.className = "sk-tekst"; tekstEl.textContent = d.tekst + (avkortet ? "\n(Svaret ble kuttet. Spør om mindre om gangen.)" : "");
    var diag = stolper(d.diagram); if (diag) b.appendChild(diag);
    if (Array.isArray(d.valg) && d.valg.length) {
      var v = el("div", "sk-valg");
      d.valg.slice(0, 5).forEach(function (x) { var k = el("button", "sk-chip", x); k.type = "button"; k.onclick = function () { spor(String(x)); }; v.appendChild(k); });
      b.appendChild(v);
    }
    var h = el("div", "sk-handling");
    var sjekk = el("button", null, "Sjekk svaret"); sjekk.type = "button"; sjekk.onclick = function () { spor("sjekk"); }; h.appendChild(sjekk);
    if (sqlLogg.length) {
      var vs = el("button", null, "Vis SQL (" + sqlLogg.length + ")"), pre = null; vs.type = "button";
      vs.onclick = function () { if (pre) { pre.remove(); pre = null; return; } pre = el("pre", "sk-sql", sqlLogg.join("\n\n")); b.appendChild(pre); rull(); };
      h.appendChild(vs);
    }
    var kp = el("button", null, "Kopier"); kp.type = "button";
    kp.onclick = function () {
      try { navigator.clipboard.writeText(d.tekst).then(function () { kp.textContent = "Kopiert"; }, function () { kp.textContent = "Kunne ikke kopiere"; }); }
      catch (e) { kp.textContent = "Kunne ikke kopiere"; }
    };
    h.appendChild(kp);
    b.appendChild(h);
  }

  // Sier Lars nei til at siden bruker Claude, tas kolonnen bort og dashbordet får hele skjermen igjen.
  function skjulChat() {
    document.body.classList.remove("med-chat"); skuff.classList.remove("sk-kolonne");
    window.kp.spor = null;
    window.dispatchEvent(new Event("resize"));
  }

  var f = document.getElementById("forslag");
  FORSLAG.forEach(function (q) { var k = el("button", "sk-chip", q); k.type = "button"; k.onclick = function () { spor(q); }; f.appendChild(k); });
  document.getElementById("skjema").onsubmit = function (e) {
    e.preventDefault(); var v = felt.value.trim(); if (v && !opptatt) { felt.value = ""; spor(v); }
  };

  (async function () {
    try {
      sample = window.claude && window.claude.use ? await window.claude.use("sample") : null;
      if (sample) { var lim = await sample.limits().catch(function () { return null; }); if (!lim || !lim.tools) sample = null; }
    } catch (e) { sample = null; }
    if (!sample) return;  // utenfor claude.ai, eller uten verktøy: ingen chat, dashbordet får hele skjermen
    window.kp.spor = function (q) { window.kp.lukkAlle(); spor(q); };
    skuff.classList.add("sk-kolonne");
    document.body.classList.add("med-chat");
    window.kp.lyttere.forEach(function (l) { l(); });
  })();
})();
</script>

<script>
/* Drift og HR: tre faste rapporter regnet med SQL i siden. «I år» går til datoen tallene gjelder (data.json). */
(function () {
  "use strict";
  var RAPPORT_SQL = {
    prestasjon: "WITH n AS (SELECT avdeling, count(*) AS ansatte FROM hr_ansatte WHERE status <> 'Sluttet' GROUP BY avdeling),\n" +
      "s AS (SELECT a.avdeling, m.ansatt_id, m.samlet_vurdering AS v FROM hr_medarbeidersamtaler m JOIN hr_ansatte a USING (ansatt_id)\n" +
      "      WHERE a.status <> 'Sluttet' AND m.dato BETWEEN '{AARSTART}' AND '{IDAG}')\n" +
      "SELECT n.avdeling AS Avdeling, n.ansatte AS Ansatte,\n" +
      "  (SELECT count(*) FROM s WHERE s.avdeling = n.avdeling AND v = 'Overgår') AS \"Overgår\",\n" +
      "  (SELECT count(*) FROM s WHERE s.avdeling = n.avdeling AND v = 'Innfrir') AS Innfrir,\n" +
      "  (SELECT count(*) FROM s WHERE s.avdeling = n.avdeling AND v = 'Delvis') AS Delvis,\n" +
      "  (SELECT count(*) FROM s WHERE s.avdeling = n.avdeling AND v = 'Under') AS Under,\n" +
      "  n.ansatte - (SELECT count(DISTINCT ansatt_id) FROM s WHERE s.avdeling = n.avdeling) AS \"Uten samtale\"\n" +
      "FROM n ORDER BY Under DESC, Delvis DESC",
    belastning: "WITH n AS (SELECT avdeling, count(*) AS ansatte FROM hr_ansatte WHERE status <> 'Sluttet' GROUP BY avdeling),\n" +
      "f AS (SELECT a.avdeling, sum(julianday(min(f.til, '{IDAG}')) - julianday(max(f.fra, '{AARSTART}')) + 1) AS dager\n" +
      "      FROM hr_fravaer f JOIN hr_ansatte a USING (ansatt_id)\n" +
      "      WHERE a.status <> 'Sluttet' AND f.type IN ('egenmelding', 'sykemelding') AND f.fra <= '{IDAG}' AND f.til >= '{AARSTART}' GROUP BY a.avdeling),\n" +
      "v AS (SELECT avdeling, sum(timer > 9) AS lange, count(*) AS vakter FROM hr_vakter WHERE dato BETWEEN '{AARSTART}' AND '{IDAG}' GROUP BY avdeling)\n" +
      "SELECT n.avdeling AS Avdeling, n.ansatte AS Ansatte, round(coalesce(f.dager, 0)) AS \"Fraværsdager\",\n" +
      "  round(coalesce(f.dager, 0) * 1.0 / n.ansatte, 1) AS \"Dager per ansatt\", coalesce(v.lange, 0) AS \"Vakter over 9 t\", coalesce(v.vakter, 0) AS Vakter\n" +
      "FROM n LEFT JOIN f USING (avdeling) LEFT JOIN v USING (avdeling) ORDER BY \"Dager per ansatt\" DESC",
    innleie: "SELECT kategori AS Kategori, count(*) AS Oppdrag, round(sum(fakturerte_timer)) AS Timer, round(sum(totalbelop_nok)) AS \"Kostnad kr\"\n" +
      "FROM hr_innleie WHERE periode_fra BETWEEN '{AARSTART}' AND '{IDAG}' GROUP BY kategori ORDER BY \"Kostnad kr\" DESC",
    vakttimer: "SELECT avdeling AS Avdeling, round(sum(timer)) AS Vakttimer, count(*) AS Vakter FROM hr_vakter\n" +
      "WHERE dato BETWEEN '{AARSTART}' AND '{IDAG}' GROUP BY avdeling ORDER BY Vakttimer DESC"
  };
  var RAPPORTER = [
    { id: "prestasjon", navn: "Prestasjon", tittel: "Prestasjon per avdeling",
      ingress: "Samlet vurdering fra årets medarbeidersamtaler, nåværende ansatte.", kilde: "hr_medarbeidersamtaler, hr_ansatte",
      deler: [{ sql: "prestasjon", merk: ["Under", "Uten samtale"] }],
      sporsmal: "Se på rapporten «Prestasjon per avdeling» (medarbeidersamtaler i år). Hvilke avdelinger bør jeg som direktør følge opp, og hvorfor?" },
    { id: "belastning", navn: "Fravær og belastning", tittel: "Fravær og belastning per avdeling",
      ingress: "Fraværsdager (egenmelding og sykemelding) i år per ansatt, ved siden av vakter over 9 timer. Ingen fraværsårsaker.", kilde: "hr_fravaer, hr_vakter, hr_ansatte",
      deler: [{ sql: "belastning", merk: ["Dager per ansatt", "Vakter over 9 t"], stolpe: "Dager per ansatt" }],
      sporsmal: "Se på rapporten «Fravær og belastning per avdeling» i år. Henger fravær og lange vakter sammen? Hva bør jeg se nærmere på?" },
    { id: "innleie", navn: "Innleie og bemanning", tittel: "Innleie og egen bemanning",
      ingress: "Innleid hjelp med oppstart i år per kategori, og egne vakttimer per avdeling.", kilde: "hr_innleie, hr_vakter",
      deler: [{ sql: "innleie", stolpe: "Kostnad kr" }, { sql: "vakttimer", stolpe: "Vakttimer" }],
      sporsmal: "Se på rapporten «Innleie og egen bemanning» i år. Hvor bruker vi mest på innleie, og er det rimelig sett mot egne vakttimer?" }
  ];
  var NB = new Intl.NumberFormat("nb-NO", { maximumFractionDigits: 1 });
  var skuff = document.getElementById("rapportskuff"), innhold = document.getElementById("rp-innhold"), faner = document.getElementById("rp-faner");
  var sporKnapp = document.getElementById("rp-spor");
  var valgt = RAPPORTER[0];

  function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = String(x); return e; }
  function sql(id) {
    var idag = window.kpDato || new Date().toISOString().slice(0, 10);
    return RAPPORT_SQL[id].split("{IDAG}").join(idag).split("{AARSTART}").join(idag.slice(0, 4) + "-01-01");
  }

  function tabell(sqlId, merk, stolpe) {
    var r = window.kp.db.exec(sql(sqlId))[0] || { columns: [], values: [] };
    var t = el("table", "rp-tabell"), hode = el("tr"), thead = el("thead"), tb = el("tbody");
    r.columns.forEach(function (k) { hode.appendChild(el("th", null, k)); });
    thead.appendChild(hode); t.appendChild(thead);
    var si = r.columns.indexOf(stolpe), maks = 0;
    if (si >= 0) r.values.forEach(function (v) { maks = Math.max(maks, Number(v[si]) || 0); });
    var merkIdx = (merk || []).map(function (m) { return r.columns.indexOf(m); });
    var topp = merkIdx.map(function (i) { return i < 0 ? null : Math.max.apply(null, r.values.map(function (v) { return Number(v[i]) || 0; })); });
    r.values.forEach(function (v) {
      var tr = el("tr");
      v.forEach(function (c, i) {
        var td = el("td", null, typeof c === "number" ? NB.format(c) : c);
        var mi = merkIdx.indexOf(i); if (mi >= 0 && topp[mi] > 0 && Number(c) === topp[mi]) td.className = "rp-merk";
        tr.appendChild(td);
      });
      tb.appendChild(tr);
    });
    t.appendChild(tb);
    var boks = el("div"); boks.style.overflowX = "auto"; boks.appendChild(t);
    if (si < 0 || !maks) return boks;
    var d = el("div", "sk-diagram");
    r.values.forEach(function (v) {
      var rad = el("div", "ss-stolpe"); rad.appendChild(el("span", null, v[0]));
      var spor = el("div", "ss-spor"), i = el("i"); i.style.width = (Number(v[si]) / maks * 100) + "%"; spor.appendChild(i); rad.appendChild(spor);
      rad.appendChild(el("b", null, NB.format(v[si]))); d.appendChild(rad);
    });
    var w = el("div"); w.style.display = "grid"; w.style.gap = "0.6rem";
    w.appendChild(el("div", "ss-etikett", stolpe)); w.appendChild(d); w.appendChild(boks);
    return w;
  }

  function vis() {
    [].forEach.call(faner.children, function (b) { b.setAttribute("aria-pressed", String(b.dataset.id === valgt.id)); });
    sporKnapp.hidden = !window.kp.spor;
    innhold.textContent = "";
    if (window.kp.feil) { innhold.appendChild(el("div", "sk-status sk-feil", "Fikk ikke lastet databasen: " + window.kp.feil)); return; }
    if (!window.kp.db) { innhold.appendChild(el("div", "sk-status", "Laster databasen … " + window.kp.steg)); return; }
    innhold.appendChild(el("h3", null, valgt.tittel));
    innhold.appendChild(el("p", "rp-ingress", valgt.ingress));
    var sqlTekst = [];
    try {
      valgt.deler.forEach(function (d) { innhold.appendChild(tabell(d.sql, d.merk, d.stolpe)); sqlTekst.push(sql(d.sql)); });
    } catch (e) { innhold.appendChild(el("div", "sk-feil", "Rapporten feilet: " + (e && e.message || e))); }
    innhold.appendChild(el("div", "ss-kilde", "Kilde: " + valgt.kilde + ". Rødt er høyest i kolonnen."));
    var h = el("div", "sk-handling"), vs = el("button", null, "Vis SQL"), pre = null; vs.type = "button";
    vs.onclick = function () { if (pre) { pre.remove(); pre = null; return; } pre = el("pre", "sk-sql", sqlTekst.join("\n\n")); innhold.appendChild(pre); };
    h.appendChild(vs); innhold.appendChild(h);
  }

  RAPPORTER.forEach(function (r) {
    var b = el("button", "sk-chip rp-fane", r.navn); b.type = "button"; b.dataset.id = r.id;
    b.onclick = function () { valgt = r; vis(); }; faner.appendChild(b);
  });
  var vistKlar = false;
  window.kp.lyttere.push(function () {
    // Tegn på nytt når databasen blir klar eller feiler, ikke hvert sekund mens den laster.
    if (!skuff.hasAttribute("data-apen")) return;
    var klar = !!(window.kp.db || window.kp.feil);
    if (klar && vistKlar) { sporKnapp.hidden = !window.kp.spor; return; }
    vistKlar = klar; vis();
  });
  function apne() { window.kp.lukkAlle(); skuff.setAttribute("data-apen", ""); vis(); window.kp.last(); }
  document.getElementById("rp-lukk").onclick = function () { skuff.removeAttribute("data-apen"); };
  sporKnapp.onclick = function () { if (window.kp.spor) window.kp.spor(valgt.sporsmal); };
  window.kp.naarToppen(function () { window.kp.knapp("drift-hr-knapp", "Drift og HR", apne); });
})();
</script>
