<style>
/* Storskjerm «Kunstpixel i dag» (DECISIONS D1–D8, SC1–SC20). Én skjerm 16:9, lesbar fra tre meter.
   Toppen har rollevalg. Under: rollens fire tall med kurve, og én stor flate om gangen med underlag.
   I claude.ai står KI-chat fast til høyre. Arbeidsflyt-tokens, én lys palett med vilje, status som ord. */
:root { --ss-bg: #f3f6f8; --ss-ink: #172b3b; --spark: #0a5f87; --spark-fyll: rgba(10,95,135,.12);
  --bra: #1d6b52; --darlig: #b42318; color-scheme: light; }
html { height: 100%; font-size: clamp(14px, min(1.15vw, 2.05vh), 30px); }
body { height: 100%; margin: 0; background: var(--ss-bg); color: var(--ss-ink);
  font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
.ss { box-sizing: border-box; height: 100%; display: grid; gap: 0.7rem;
  grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr);
  padding-block: 0.7rem; padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--canvas); color: var(--ink); }
.ss *, .ss *::before, .ss *::after { box-sizing: border-box; }
.ss [hidden] { display: none !important; }
.ss :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

/* Toppen: navn, rollevalg, tidspunkt, fullskjerm. Én linje. */
.ss-topp { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.7rem;
  background: var(--topbar); color: var(--topbar-ink); border-radius: var(--radius-card); padding: 0.45rem 0.6rem 0.45rem 1rem; }
.ss-navn { font-size: 1.2rem; font-weight: 700; margin: 0 0.3rem 0 0; letter-spacing: -.01em; }
.ss-roller { display: flex; flex-wrap: wrap; gap: 0.25rem; padding: 0.2rem; background: rgba(255,255,255,.08); border-radius: var(--radius-pill); }
.ss-rolle { font: inherit; font-size: 0.92rem; font-weight: 600; color: var(--topbar-muted); background: transparent; border: 0;
  border-radius: var(--radius-pill); padding: 0.28rem 0.6rem; cursor: pointer; display: inline-flex; align-items: center; gap: 0.4rem; }
.ss-rolle:hover { color: var(--topbar-ink); background: rgba(255,255,255,.08); }
.ss-rolle[aria-pressed="true"] { background: var(--topbar-ink); color: var(--topbar); }
.ss-prikk { min-width: 1.35rem; height: 1.35rem; border-radius: var(--radius-pill); font-size: 0.92rem; font-weight: 700; line-height: 1;
  display: inline-grid; place-items: center; padding: 0 0.3rem; background: var(--gold-soft); color: var(--gold); }
.ss-prikk[data-niva="Over terskel"] { background: var(--danger); color: #fff; }
.ss-tid { margin-left: auto; font-size: 0.95rem; color: var(--topbar-muted); white-space: nowrap; }
.ss-tid b { color: var(--topbar-ink); font-weight: 600; }
.ss-knapp { font: inherit; font-size: 0.95rem; font-weight: 600; color: var(--topbar); background: var(--topbar-ink);
  border: 0; border-radius: var(--radius-field); padding: 0.35rem 0.9rem; cursor: pointer; }
.ss-knapp:hover { background: var(--blue-soft); }

/* Rollens fire tall. Tallet, endringen med pil og en kurve over de siste ukene. Kilde ved mus og i underlaget. */
.ss-flater { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: 0.7rem; }
.ss-flate { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-card); padding: 0.7rem 1rem 0.6rem;
  display: grid; grid-template-rows: auto auto auto 1fr; gap: 0.15rem; min-width: 0; position: relative; }
.ss-flate[data-s="Følg med"] { border-top: 4px solid var(--gold); }
.ss-flate[data-s="Over terskel"] { border-top: 4px solid var(--danger); }
.ss-etikett { font-size: 0.95rem; font-weight: 600; color: var(--muted); margin: 0; }
.ss-tallrad { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.2rem 0.6rem; }
.ss-tall { font-size: 2.3rem; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.ss-tall.ukjent { color: var(--muted); font-size: 1.8rem; }
.ss-enhet { font-size: 1rem; font-weight: 600; color: var(--muted); margin-left: 0.25rem; letter-spacing: 0; }
.ss-status { font-size: 0.92rem; font-weight: 700; border-radius: var(--radius-pill); padding: 0.05rem 0.65rem; }
.ss-status[data-s="Følg med"] { background: var(--gold-soft); color: var(--gold); }
.ss-status[data-s="Over terskel"] { background: var(--danger-soft); color: var(--danger); }
.ss-status[data-s="Ukjent"] { background: var(--neutral-soft); color: var(--neutral-ink); }
.ss-endring { font-size: 0.92rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.ss-endring b { font-weight: 700; }
.ss-endring b[data-god="ja"] { color: var(--bra); }
.ss-endring b[data-god="nei"] { color: var(--darlig); }
.ss-spark { height: 2.6rem; min-height: 0; margin-top: 0.2rem; }
.ss-spark svg { width: 100%; height: 100%; display: block; overflow: visible; }

/* Den store flaten. */
.ss-scene { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-card);
  display: flex; flex-direction: column; gap: 0.6rem; min-height: 0; min-width: 0; padding: 0.8rem 1.3rem 1rem; }
.ss-faner { display: flex; flex-wrap: wrap; align-items: center; gap: 0.45rem; }
.ss-fane { font: inherit; font-size: 0.95rem; font-weight: 600; cursor: pointer; border: 1px solid var(--button-border);
  background: var(--paper); color: var(--neutral-ink); border-radius: var(--radius-pill); padding: 0.22rem 0.95rem; }
.ss-fane[aria-pressed="true"] { background: var(--topbar); border-color: var(--topbar); color: var(--topbar-ink); }
.ss-dypere { margin-left: auto; border-color: var(--blue); background: var(--blue); color: #fff; }
.ss-dypere[aria-pressed="true"] { background: var(--paper); color: var(--blue); }
.ss-pause { background: transparent; }
.ss-felt { flex: 1; min-height: 0; min-width: 0; display: flex; flex-direction: column; gap: 0.5rem; }
.ss-fhode { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 0.1rem 1.2rem; }
.ss-felt h2 { font-size: 1.55rem; font-weight: 700; letter-spacing: -.01em; margin: 0; }
.ss-kilde { font-size: 0.92rem; color: var(--muted); }
.ss-linje { font-size: 0.92rem; color: var(--muted); }
.ss-tegning { flex: 1; min-height: 0; position: relative; }
.ss-tegning svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.ss-tegning text { font-family: inherit; font-size: 1rem; fill: var(--muted); }
.ss-tegning .ss-verdi { fill: var(--ink); font-weight: 700; }
.ss-forklaring { display: flex; flex-wrap: wrap; gap: 0.3rem 1.2rem; font-size: 0.92rem; color: var(--muted); }
.ss-forklaring i { display: inline-block; width: 1.4rem; height: 0; border-top: 4px solid var(--blue); vertical-align: middle; margin-right: 0.35rem; }
.ss-forklaring i.fjor { border-top: 3px dashed var(--muted); }

.ss-stolper { flex: 1; min-height: 0; display: grid; align-content: start; gap: 0.5rem; overflow: hidden; }
.ss-stolpe { display: grid; grid-template-columns: minmax(0, 22rem) minmax(0, 1fr) auto; align-items: center; gap: 1rem; font-size: 1.1rem; }
.ss-stolpe span:first-child { overflow-wrap: anywhere; }
.ss-spor { height: 0.95rem; background: var(--track); border-radius: 3px; overflow: hidden; }
.ss-spor i { display: block; height: 100%; background: var(--blue); border-radius: 0 3px 3px 0; }
.ss-stolpe b { font-variant-numeric: tabular-nums; text-align: right; }

.ss-hode { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.2rem 0.9rem; }
.ss-stort { font-size: 3.8rem; font-weight: 700; line-height: 0.95; font-variant-numeric: tabular-nums; color: var(--green-ink); }
[data-forfalt] .ss-stort { color: var(--danger); }
.ss-tre { display: flex; flex-wrap: wrap; gap: 0.2rem 1.4rem; font-size: 1rem; color: var(--muted); }
.ss-tre b { font-size: 1.25rem; color: var(--ink); font-variant-numeric: tabular-nums; }
.ss-liste { list-style: none; margin: 0; padding: 0; display: grid; }
.ss-liste li { font-size: 1.15rem; line-height: 1.3; padding: 0.42rem 0; border-top: 1px solid var(--line); }
.ss-frist li { font-weight: 600; }
.ss-liste small { display: block; font-size: 0.95rem; font-weight: 400; color: var(--muted); }
.ss-over { font-weight: 700; color: var(--danger); }

.ss-rull { flex: 1; min-height: 0; overflow: auto; }
.ss-tab { width: 100%; border-collapse: collapse; font-size: 1.05rem; }
.ss-tab th { text-align: left; font-size: 0.92rem; font-weight: 600; color: var(--muted); white-space: nowrap;
  padding: 0.35rem 1rem 0.35rem 0; border-bottom: 2px solid var(--line); position: sticky; top: 0; background: var(--paper); }
.ss-tab td { padding: 0.42rem 1rem 0.42rem 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.ss-tab .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

.ss-feil { background: var(--danger-soft); color: var(--danger); border-radius: var(--radius-card);
  padding: 1.2rem; font-size: 1.2rem; font-weight: 600; }

@media (max-width: 900px) {
  html { font-size: 16px; }
  body, .ss { height: auto; }
  .ss { grid-template-rows: none; }
  .ss-flater { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ss-tegning { flex: none; height: 15rem; }
  .ss-tid, .ss-dypere { margin-left: 0; }
  .ss-scene { padding-inline: 0.9rem; }
  .ss-stolpe { grid-template-columns: minmax(0, 1fr) auto; }
  .ss-spor { grid-column: 1 / -1; grid-row: 2; }
}
@media (max-width: 480px) { .ss-flater { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
(function () {
  "use strict";
  var main = document.querySelector("main");
  var SVG = "http://www.w3.org/2000/svg";
  var BYTT_MS = 12000;   // så lenge står hver flate før neste vises
  var VIS_FRISTER = 3;   // flere får ikke plass på storskjerm; resten står i underlaget
  var data = null, rolle = null, naa = 0, apen = false, klokke = null, tegnere = [];
  var gaar = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function nb(des) { return new Intl.NumberFormat("nb-NO", { minimumFractionDigits: des || 0, maximumFractionDigits: des || 0 }); }
  function tall(v, des) { return v === null || v === undefined ? "–" : nb(des).format(v); }
  function el(tag, cls, tekst) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (tekst !== undefined && tekst !== null) e.textContent = String(tekst);
    return e;
  }
  function svg(tag, attr, tekst, mor) {
    var e = document.createElementNS(SVG, tag);
    Object.keys(attr).forEach(function (k) { e.setAttribute(k, attr[k]); });
    if (tekst !== undefined && tekst !== null) e.textContent = tekst;
    if (mor) mor.appendChild(e);
    return e;
  }
  function dm(iso) { var d = String(iso || "").split("-"); return d.length === 3 ? d[2] + "." + d[1] : String(iso || ""); }
  function rem() { return parseFloat(getComputedStyle(document.documentElement).fontSize); }
  function varsler(r) { return r.fliser.filter(function (f) { return f.status === "Følg med" || f.status === "Over terskel"; }); }

  // Tegning som følger størrelsen på boksen sin (tegnes på nytt når vinduet eller chatten endrer bredden).
  function tegnI(boks, f) {
    function tegn() { while (boks.firstChild) boks.removeChild(boks.firstChild); var w = boks.clientWidth, h = boks.clientHeight; if (w > 20 && h > 20) f(w, h); }
    tegn();
    if (window.ResizeObserver) { var ro = new ResizeObserver(tegn); ro.observe(boks); tegnere.push(ro); }
  }

  // Kurve i flisen: område under, siste punkt markert. Uker uten tall er hull, ikke 0.
  function spark(boks, serie, god) {
    tegnI(boks, function (w, h) {
      var v = serie.filter(function (x) { return x !== null; });
      if (v.length < 2) return;
      var lo = Math.min.apply(null, v), hi = Math.max.apply(null, v);
      if (hi === lo) { hi += 1; lo -= 1; }
      var p = 4, x = function (i) { return p + i * (w - 2 * p) / (serie.length - 1); };
      var y = function (n) { return h - p - (n - lo) / (hi - lo) * (h - 2 * p); };
      var s = svg("svg", { "aria-hidden": "true" }, null, boks);
      var biter = [], bit = [];
      serie.forEach(function (n, i) { if (n === null) { if (bit.length) biter.push(bit); bit = []; } else bit.push([x(i), y(n)]); });
      if (bit.length) biter.push(bit);
      biter.forEach(function (b) {
        if (b.length > 1) svg("path", { d: "M" + b.map(function (q) { return q.join(","); }).join("L") + "L" + b[b.length - 1][0] + "," + (h - p) + "L" + b[0][0] + "," + (h - p) + "Z",
          fill: "var(--spark-fyll)", stroke: "none" }, null, s);
        svg("polyline", { points: b.map(function (q) { return q.join(","); }).join(" "), fill: "none", stroke: "var(--spark)",
          "stroke-width": 2.5, "stroke-linejoin": "round", "stroke-linecap": "round" }, null, s);
      });
      var siste = biter.length ? biter[biter.length - 1] : null;
      if (siste) svg("circle", { cx: siste[siste.length - 1][0], cy: siste[siste.length - 1][1], r: 4.5,
        fill: god === "nei" ? "var(--darlig)" : "var(--spark)", stroke: "var(--paper)", "stroke-width": 2 }, null, s);
    });
  }

  function flis(f) {
    var s = el("section", "ss-flate"); s.id = "flis-" + f.id;
    s.title = "Kilde: " + f.kilde;
    if (f.status && f.status !== "Normal") s.setAttribute("data-s", f.status);
    s.appendChild(el("h2", "ss-etikett", f.navn));
    var rad = el("div", "ss-tallrad");
    // Millioner vises som «17,2 mill. kr», så tallet kan leses på avstand og får plass i flisen. Eksakt tall står i underlaget.
    var mill = f.verdi !== null && Math.abs(f.verdi) >= 1e6;
    var t = el("div", "ss-tall" + (f.verdi === null ? " ukjent" : ""), f.verdi === null ? "Ukjent" : mill ? tall(f.verdi / 1e6, 1) : tall(f.verdi, f.des));
    if (f.verdi !== null && (f.enhet || mill)) t.appendChild(el("span", "ss-enhet", (mill ? "mill. " : "") + f.enhet));
    rad.appendChild(t);
    if (f.status && f.status !== "Normal") { var st = el("span", "ss-status", f.status); st.setAttribute("data-s", f.status); rad.appendChild(st); }
    s.appendChild(rad);
    var e = el("div", "ss-endring"), god = null;
    if (f.verdi !== null && f.endring_pst !== null && f.endring_pst !== undefined) {
      var pil = f.retning > 0 ? "▲ " : f.retning < 0 ? "▼ " : "";
      if (f.bra && f.retning) god = f.retning * f.bra > 0 ? "ja" : "nei";
      var b = el("b", null, pil + (f.endring_pst > 0 ? "+" : "") + tall(f.endring_pst, 1) + " %");
      if (god) b.setAttribute("data-god", god);
      e.appendChild(b); e.appendChild(document.createTextNode(" · " + f.sammenligning));
    } else e.textContent = f.sammenligning || "";
    s.appendChild(e);
    var sp = el("div", "ss-spark");
    s.appendChild(sp);
    if (f.serie) s._tegn = function () { spark(sp, f.serie, god); };
    return s;
  }

  // Linjediagram for flaten: hovedserien heltrukket med område, de andre stiplet. Hull der kilden mangler tall.
  function linje(boks, p) {
    var d = p.data;
    tegnI(boks, function (w, h) {
      var r = rem(), v = { l: 4.6 * r, r: 7.2 * r, t: 1.2 * r, b: 2 * r }, alle = [];
      d.serier.forEach(function (s) { s.verdier.forEach(function (n) { if (n !== null) alle.push(n); }); });
      if (!alle.length) return;
      var lo = Math.min(0, Math.min.apply(null, alle)), hi = Math.max.apply(null, alle);
      // Rund av til et pent steg (1, 2 eller 5 ganger en tierpotens), så aksen ikke får mye tom plass.
      var rå = (hi - lo) / 4 || 1, p10 = Math.pow(10, Math.floor(Math.log10(rå))), steg = [1, 2, 5, 10].map(function (k) { return k * p10; }).filter(function (s) { return s >= rå; })[0];
      hi = Math.ceil(hi / steg) * steg; lo = lo < 0 ? Math.floor(lo / steg) * steg : 0;
      if (d.enhet === "av 5") { lo = Math.floor(Math.min.apply(null, alle) * 2) / 2; hi = Math.ceil(Math.max.apply(null, alle) * 2) / 2; if (hi === lo) hi += 0.5; }
      var n = d.etiketter.length;
      var x = function (i) { return v.l + i * (w - v.l - v.r) / Math.max(n - 1, 1); };
      var y = function (t) { return h - v.b - (t - lo) / (hi - lo) * (h - v.t - v.b); };
      var s = svg("svg", { role: "img", "aria-label": p.tittel }, null, boks);
      var kort = function (t) { return Math.abs(t) >= 1e6 ? tall(t / 1e6, 1) + " mill." : tall(t, d.des); };
      var linjer = [];
      if (d.enhet === "av 5") linjer = [lo, (lo + hi) / 2, hi];
      else for (var t0 = lo; t0 <= hi + steg / 2; t0 += steg) linjer.push(Math.round(t0 / steg) * steg);
      linjer.forEach(function (t) {
        svg("line", { x1: v.l, x2: w - v.r, y1: y(t), y2: y(t), stroke: "var(--line)", "stroke-width": 1 }, null, s);
        svg("text", { x: v.l - 0.5 * r, y: y(t) + 0.35 * r, "text-anchor": "end" }, kort(t), s);
      });
      if (lo < 0) svg("line", { x1: v.l, x2: w - v.r, y1: y(0), y2: y(0), stroke: "var(--input-border)", "stroke-width": 1 }, null, s);
      var hvert = Math.max(1, Math.ceil(4.4 * r / Math.max(x(1) - x(0), 1)));
      d.etiketter.forEach(function (e, i) {
        if (i !== n - 1 && (n - 1 - i) % hvert !== 0) return;
        svg("text", { x: x(i), y: h - 0.4 * r, "text-anchor": "middle" }, e, s);
      });
      var siste = [];
      d.serier.slice().reverse().forEach(function (se) {
        var hoved = !!se.hoved, farge = hoved ? "var(--blue)" : "var(--muted)", biter = [], bit = [];
        se.verdier.forEach(function (t, i) { if (t === null) { if (bit.length) biter.push(bit); bit = []; } else bit.push([x(i), y(t), t]); });
        if (bit.length) biter.push(bit);
        biter.forEach(function (b) {
          if (hoved && b.length > 1) svg("path", { d: "M" + b.map(function (q) { return q[0] + "," + q[1]; }).join("L") + "L" + b[b.length - 1][0] + "," + y(Math.max(lo, 0)) + "L" + b[0][0] + "," + y(Math.max(lo, 0)) + "Z",
            fill: "var(--spark-fyll)" }, null, s);
          svg("polyline", { points: b.map(function (q) { return q[0] + "," + q[1]; }).join(" "), fill: "none", stroke: farge,
            "stroke-width": hoved ? 4 : 2.5, "stroke-dasharray": hoved ? "none" : "8 6", "stroke-linejoin": "round" }, null, s);
        });
        var sb = biter.length ? biter[biter.length - 1] : null;
        if (sb) { var q = sb[sb.length - 1]; svg("circle", { cx: q[0], cy: q[1], r: hoved ? 6 : 4.5, fill: farge }, null, s); siste.push({ q: q, se: se, hoved: hoved }); }
      });
      // Etikettene for siste verdi: den høyeste over punktet, den andre under, så de ikke overlapper.
      siste.sort(function (a, b) { return a.q[1] - b.q[1]; });
      siste.forEach(function (o, i) {
        svg("text", { x: o.q[0] + 0.6 * r, y: o.q[1] + (i === 0 ? -0.35 : 1.05) * r, "class": o.hoved ? "ss-verdi" : "" },
          o.se.navn + " " + kort(o.q[2]), s);
      });
    });
  }

  function stolper(p) {
    var d = p.data, boks = el("div", "ss-stolper"), maks = 0;
    d.rader.forEach(function (r) { maks = Math.max(maks, Math.abs(r.verdi || 0)); });
    d.rader.forEach(function (r) {
      var rad = el("div", "ss-stolpe"); rad.appendChild(el("span", null, r.navn));
      var spor = el("div", "ss-spor"), fyll = el("i");
      fyll.style.width = (maks ? Math.abs(r.verdi || 0) / maks * 100 : 0) + "%";
      if (r.verdi < 0) fyll.style.background = "var(--danger)";
      spor.appendChild(fyll); rad.appendChild(spor);
      var fmt = Math.abs(r.verdi || 0) >= 1e6 ? tall(r.verdi / 1e6, 1) + " mill. " + d.enhet : tall(r.verdi, d.des) + (d.enhet ? " " + d.enhet : "");
      rad.appendChild(el("b", null, fmt));
      boks.appendChild(rad);
    });
    if (!d.rader.length) boks.appendChild(el("div", "ss-linje", "Ingen tall for perioden."));
    return boks;
  }

  function fristliste(p, idag) {
    var d = p.data, boks = el("div", "ss-visning");
    boks.style.cssText = "display:flex;flex-direction:column;gap:0.5rem;min-height:0";
    var forfalt = d.antall.Forfalt || 0;
    if (forfalt) boks.setAttribute("data-forfalt", "");
    var h = el("div", "ss-hode");

<script>
/* Databasen i minnet, lastet første gang den trengs: ca. 4 MB og en SQL-motor fra cdnjs. */
(function () {
  "use strict";
  var CDN = "https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.12.0/";
  var laster = null;
  window.kp = { db: null, instruks: null, steg: "", feil: null, start: 0, slutt: 0, lyttere: [] };
  function melde() { window.kp.lyttere.forEach(function (f) { try { f(); } catch (e) {} }); }
  function steg(t) { window.kp.steg = t; melde(); }
  function lastSkript(src) {
    return new Promise(function (ja, nei) {
      var s = document.createElement("script"); s.src = src; s.onload = ja;
      s.onerror = function () { nei(new Error("kunne ikke laste " + src)); }; document.head.appendChild(s);
    });
  }
  function frist(p, ms, hva) {
    return Promise.race([p, new Promise(function (_, nei) { setTimeout(function () { nei(new Error(hva + " tok over " + ms / 1000 + " s")); }, ms); })]);
  }
  window.kp.last = function () {
    if (laster) return laster;
    window.kp.start = performance.now();
    var tikk = setInterval(melde, 1000);
    laster = (async function () {
      var SQL, motor = "rask";
      var dbTekst = fetch("museum.db.gz.txt").then(function (r) { if (!r.ok) throw new Error("databasen: HTTP " + r.status); return r.text(); });
      var instTekst = fetch("chat-instruks.txt").then(function (r) { if (!r.ok) throw new Error("instruksen: HTTP " + r.status); return r.text(); });
      dbTekst.catch(function () {}); instTekst.catch(function () {});
      steg("1/4 Laster SQL-motoren");
      try {
        await frist(lastSkript(CDN + "sql-wasm.min.js"), 10000, "SQL-motoren");
        SQL = await frist(initSqlJs({ locateFile: function (f) { return CDN + f; } }), 10000, "SQL-motoren");
      } catch (e) {
        // claude.ai kan stoppe WebAssembly. Da brukes den rene JavaScript-utgaven: tregere, samme SQL.
        motor = "reserve"; steg("1/4 Laster reserve-motoren"); window.initSqlJs = undefined;
        await frist(lastSkript(CDN + "sql-asm-memory-growth.min.js"), 30000, "Reserve-motoren"); SQL = await initSqlJs();
      }
      steg("2/4 Henter databasen (motor: " + motor + ")");
      var b64 = (await frist(dbTekst, 60000, "Henting av databasen")).trim();
      steg("3/4 Pakker ut databasen");
      var bin = atob(b64), u = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
      var ut = new Blob([u]).stream().pipeThrough(new DecompressionStream("gzip"));
      var raa = new Uint8Array(await new Response(ut).arrayBuffer());
      steg("4/4 Åpner databasen");
      var db = new SQL.Database(raa);
      db.exec("PRAGMA query_only = ON");

      window.kp.db = db;

      .then(function () { window.kp.slutt = performance.now(); clearInterval(tikk); melde(); });
    return laster;

})();

      if (v[i] < 0) fyll.style.background = "var(--danger)";
      spor.appendChild(fyll); rad.appendChild(spor);
      rad.appendChild(el("b", null, (isFinite(v[i]) ? NB.format(v[i]) : "–") + (d.enhet ? " " + d.enhet : ""))); boks.appendChild(rad);
    }
    return boks;
  }

  var FEIL = { not_granted: "Siden fikk ikke lov til å bruke Claude. Last siden på nytt og trykk Tillat.",
    rate_limited: "For mange spørsmål akkurat nå. Vent litt og prøv igjen.",
    tools_unavailable: "KI-chat kan ikke kjøre SQL her. Åpne siden i claude.ai i nettleseren.",
    session_expired: "Du må logge inn på nytt i claude.ai.",
    prompt_too_large: "Samtalen ble for lang. Last siden på nytt for å starte en ny.",
    refused: "Claude ville ikke svare på dette. Spør på en annen måte.",
    sampling_disabled: "Claude er ikke tilgjengelig for denne kontoen." };

  async function spor(q) {
    if (opptatt || !q) return;
    var st = document.getElementById("status"); if (st) st.remove();
    logg.appendChild(el("div", "sk-du", q));
    var b = el("div", "sk-claude"), tekstEl = el("div", "sk-tekst sk-tenker", "Tenker … henter tall med SQL");
    var stopp = el("button", "sk-chip", "Stopp"); stopp.type = "button";
    b.appendChild(tekstEl); b.appendChild(stopp); logg.appendChild(b); rull();
    opptatt = true; sendKnapp.disabled = true;
    var sqlLogg = [], ctl = new AbortController();
    stopp.onclick = function () { ctl.abort(); };
    try {
      await window.kp.last();
      if (!window.kp.db) throw { code: "ingen_db" };
      turer.push({ role: "user", content: (rolle ? "[Rolle: " + rolle.navn + "] " : "") + q });
      var meldinger = [{ role: "user", content: window.kp.instruks }].concat(turer.slice(-20));
      var svar = await sample(meldinger, { signal: ctl.signal,
        onText: function (u) { tekstEl.className = "sk-tekst"; tekstEl.textContent = del(u.text).tekst; rull(); },
        tools: [{ name: "sql",
          description: "Kjører én lesende SQLite-spørring (SELECT eller WITH) mot hele museum.db. Returnerer kolonner, antall, rader (maks 200) og om svaret ble kuttet.",
          inputSchema: { type: "object", properties: { sporring: { type: "string", description: "Én SELECT- eller WITH-spørring" } }, required: ["sporring"] },
          execute: function (inp) { tekstEl.textContent = "Henter tall med SQL (" + (sqlLogg.length + 1) + ") …"; return kjorSql(inp && inp.sporring, sqlLogg); } }] });
      turer.push({ role: "assistant", content: svar.text });
      vis(b, tekstEl, stopp, svar.text, sqlLogg, svar.truncated);
    } catch (e) {
      stopp.remove();
      var kode = e && e.code;
      if (kode === "cancelled") { tekstEl.className = "sk-tekst"; tekstEl.textContent = (e.text ? del(e.text).tekst + "\n" : "") + "Stoppet."; }
      else if (kode === "ingen_db") { tekstEl.className = "sk-tekst sk-feil"; tekstEl.textContent = "Fikk ikke lastet databasen: " + window.kp.feil; }
      else {
        tekstEl.className = "sk-tekst sk-feil";
        tekstEl.textContent = (e && e.text ? del(e.text).tekst + "\n\n" : "") + (FEIL[kode] || ("Noe gikk galt (" + (kode || (e && e.message) || "ukjent") + "). Prøv igjen."));
        if (kode === "not_granted" || kode === "sampling_disabled") skjulChat();
      }
      if (turer.length && turer[turer.length - 1].role === "user") turer.pop();
    } finally { opptatt = false; sendKnapp.disabled = false; rull(); }
  }

  function vis(b, tekstEl, stopp, tekst, sqlLogg, avkortet) {
    stopp.remove();
    var d = del(tekst);
    tekstEl.className = "sk-tekst"; tekstEl.textContent = d.tekst + (avkortet ? "\n(Svaret ble kuttet. Spør om mindre om gangen.)" : "");
    var diag = stolper(d.diagram); if (diag) b.appendChild(diag);
    if (Array.isArray(d.valg) && d.valg.length) {
      var v = el("div", "sk-valg");
      d.valg.slice(0, 5).forEach(function (x) { var k = el("button", "sk-chip", x); k.type = "button"; k.onclick = function () { spor(String(x)); }; v.appendChild(k); });
      b.appendChild(v);
    }
    var h = el("div", "sk-handling");
    var sjekk = el("button", null, "Sjekk svaret"); sjekk.type = "button"; sjekk.onclick = function () { spor("sjekk"); }; h.appendChild(sjekk);
    if (sqlLogg.length) {
      var vs = el("button", null, "Vis SQL (" + sqlLogg.length + ")"), pre = null; vs.type = "button";
      vs.onclick = function () { if (pre) { pre.remove(); pre = null; return; } pre = el("pre", "sk-sql", sqlLogg.join("\n\n")); b.appendChild(pre); rull(); };
      h.appendChild(vs);
    }
    var kp = el("button", null, "Kopier"); kp.type = "button";
    kp.onclick = function () {
      try { navigator.clipboard.writeText(d.tekst).then(function () { kp.textContent = "Kopiert"; }, function () { kp.textContent = "Kunne ikke kopiere"; }); }
      catch (e) { kp.textContent = "Kunne ikke kopiere"; }
    };
    h.appendChild(kp);
    b.appendChild(h);
  }

  // Sier Lars nei til at siden bruker Claude, tas kolonnen bort og dashbordet får hele skjermen igjen.
  function skjulChat() { document.body.classList.remove("med-chat"); window.dispatchEvent(new Event("resize")); }

  document.getElementById("skjema").onsubmit = function (e) {
    e.preventDefault(); var v = felt.value.trim(); if (v && !opptatt) { felt.value = ""; spor(v); }
  };

  (async function () {
    try {
      sample = window.claude && window.claude.use ? await window.claude.use("sample") : null;
      if (sample) { var lim = await sample.limits().catch(function () { return null; }); if (!lim || !lim.tools) sample = null; }
    } catch (e) { sample = null; }
    if (!sample) return;  // utenfor claude.ai, eller uten verktøy: ingen chat, dashbordet får hele skjermen
    document.body.classList.add("med-chat");
    if (window.kpRolle && window.kpRolle()) settRolle(window.kpRolle());
  })();
})();
</script>
