system: No Excuse Ledelse 60:2 - Prioriterte tiltak for Kunstpixel
kriterium: Lavt omfang / Høy effekt (Quick Wins)
antall_tiltak: 29
tiltak:
- id: NE-01
  omrade: Identitet
  tema: Opplevd markedsidentitet
  handling: Kunstpixel oppfattes som en tilgjengelig og ubyrakratisk kulturarena i
    SMB-skala som formidler norsk kunsthistorie og samtidskunst uten akademisk fremmedgjoring.
  status: Aktiv / Etterleves
- id: NE-02
  omrade: Identitet
  tema: Identitet i ledelse
  handling: Direktoren og lederne opptrer som synlige veivisere som balanserer kunstnerisk
    autonomi med streng etisk forvaltning.
  status: Aktiv / Etterleves
- id: NE-03
  omrade: Identitet
  tema: Identitet i formidling
  handling: Formidling i oyehoyde; veggtekster pa 50-90 ord som fokuserer pa det synlige
    foran teoretisk sjargong.
  status: Aktiv / Etterleves
- id: NE-08
  omrade: Identitet
  tema: Ambisjonsbevissthet
  handling: Ambisjon om a vaere Norges ledende SMB-museum pa digital formidling og
    autonom drift.
  status: Aktiv / Etterleves
- id: NE-09
  omrade: Identitet
  tema: Verdibevissthet
  handling: Verdiene integritet, apent vertskap og baerekraft etterleves i alle ledd
    fra kafe til kuratering.
  status: Aktiv / Etterleves
- id: NE-13
  omrade: Identitet
