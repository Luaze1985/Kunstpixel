# Innstillinger for syntetiske kundedata i Kunstpixel.
# Her endrer du volum, priser, medlemstyper og fordeler uten å røre koden.
# Etter en endring: py -3.13 -m src.kunstpixel.persondata.generer --overskriv
#
# Alle personer i kundedataene er oppdiktet (datakilde: syntetisk).

periode:
  fra: "2021-11-02"   # 5 år tilbake
  til: "2026-11-02"   # referansedato

seed: 2026            # samme seed gir nøyaktig samme data

# Antall ved skala "full". Skala "test" ganger alt med 0,02.
volum:
  kontakter: 5000              # i tillegg kommer én kontakt per ansatt
  aktive_medlemskap: 800       # omtrent antall aktive på en gitt dag
  fornyelsesandel: 0.65
  medlemsbesok_per_aar: 4
  fordel_bruk: 6000
  gavekort_per_aar: 300
  arrangementer: 300           # i tillegg kommer hendelser fra museum.db
  skolebestillinger: 500
  utleie: 100
  henvendelser: 3000

andeler:
  nyhetsbrev_samtykke: 0.40
  trekker_samtykke: 0.10
  henvendelser_med_persondata: 0.05
  henvendelser_med_kontakt: 0.30
  gavekort_med_mottaker: 0.40
  gavekort_aldri_brukt: 0.15
  maks_medlemsandel_av_dagsbesok: 0.25

# Medlemstyper: årspris i kr og andel av nye medlemskap (ansatt fordeles ikke tilfeldig).
medlemskapstyper:
  enkelt:  {aarspris: 450,  andel: 0.40}
  familie: {aarspris: 750,  andel: 0.20}
  senior:  {aarspris: 350,  andel: 0.15}
  student: {aarspris: 250,  andel: 0.15}
  venn:    {aarspris: 2500, andel: 0.10}
  ansatt:  {aarspris: 0,    andel: 0.0}

# Fordeler: beskrivelse og hvilke medlemstyper som har dem.
fordeler:
  fri_inngang:
    beskrivelse: "Fri inngang hele året"
    typer: [enkelt, familie, senior, student, venn, ansatt]
  rabatt_butikk_10:
    beskrivelse: "10 % rabatt i museumsbutikken"
    typer: [enkelt, familie, senior, student]
  rabatt_butikk_20:
    beskrivelse: "20 % rabatt i museumsbutikken"
    typer: [venn, ansatt]
  rabatt_kafe_10:
    beskrivelse: "10 % rabatt i kaféen"
    typer: [enkelt, familie, senior, student, venn, ansatt]
  forhandsvisning:
    beskrivelse: "Forhåndsvisning av nye utstillinger"
    typer: [venn, familie]
  invitasjon_aapning:
    beskrivelse: "Invitasjon til utstillingsåpninger"
    typer: [venn, ansatt]
  gratis_omvisning:
    beskrivelse: "Gratis guidet omvisning"
    typer: [venn, senior]
  medbring_gjest:
    beskrivelse: "Ta med én gjest gratis"
    typer: [venn, familie]

gavekort:
  belop: [200, 300, 500, 1000]
  gyldighet_dager: 1096        # 3 år (foreldelsesloven) – må verifiseres
