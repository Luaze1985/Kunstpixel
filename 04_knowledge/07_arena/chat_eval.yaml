    turer: ["Hvem kan ta vakt i vaktrommet lørdag 7. november 2026 kl. 08–16?"]
    fasit: [{verktoy: get_staffing_candidates, args: {stasjon: "Vaktrom / Sikkerhetssentral", dato: "2026-11-07", start: "08:00", slutt: "16:00"}}]
    forventet: ["Fredrik Ruud", "Stian Pedersen", "Fatima Al-Mansoor", "Stian Haugen"]
    forbudt: ["Trond Bakken"]
    verktoy_krav: [[get_staffing_candidates]]
    maks_kall: 4
