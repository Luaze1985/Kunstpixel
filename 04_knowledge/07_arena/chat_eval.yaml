  - id: B2
    kategori: bemanning
    turer: ["Hvilke innleide kan stå i Sal A lørdag 14. mars 2026 kl. 10–17, og hvorfor er ikke Trond Bakken med?"]
    fasit:
      - {verktoy: get_staffing_candidates, args: {stasjon: "Sal A (Mytologi og natur)", dato: "2026-03-14", start: "10:00", slutt: "17:00"}}
      - {verktoy: search_active_contractors, args: {query: Trond}}
    forventet: ["Stian Haugen", "Elena", ["2026-04-01", "1. april", "april", "avtale"]]
    verktoy_krav: [[get_staffing_candidates, search_active_contractors], [get_staffing_candidates, get_employee_cv]]
    se_etter: Riktig grunn er at avtalen hans starter 2026-04-01, ikke kursene.

  - id: B3
    kategori: bemanning
    turer: ["Kan Magnus Hansen (KP-ANS-096) ta vakt i vaktrommet lørdag 21. november 2026 kl. 15–23? Sjekk kurs, overlapp og hviletid."]
    fasit: [{verktoy: check_staffing_selection, args: {stasjon: "Vaktrom / Sikkerhetssentral", dato: "2026-11-21", start: "15:00", slutt: "23:00", ids: [KP-ANS-096]}}]
    forventet: [["overlapp", "allerede"], ["vekter", "kurs"]]
    verktoy_krav: [[check_staffing_selection]]
    se_etter: To funn. Han mangler kursene, og han har allerede en registrert vakt på samme tid.

  - id: B4
    kategori: bemanning
    turer: ["Hvem er utilgjengelig i vaktrommet lørdag 14. november 2026 kl. 08–16, og hvorfor?"]
    fasit: [{verktoy: get_staffing_candidates, args: {stasjon: "Vaktrom / Sikkerhetssentral", dato: "2026-11-14", start: "08:00", slutt: "16:00"}}]
    forventet: ["Stian Pedersen", ["sykemelding", "sykmeld", "sykemeld"]]
    verktoy_krav: [[get_staffing_candidates]]

  - id: B5
    kategori: bemanning
    turer: ["Hvem har hatt flest helgevakter i vaktrommet fra 7. november 2025 til 6. november 2026?"]
    fasit: [{verktoy: get_weekend_shift_history, args: {fra: "2025-11-07", til: "2026-11-06", stasjon: "Vaktrom / Sikkerhetssentral"}}]
    forventet: ["Terje Bratt", "14"]
    verktoy_krav: [[get_weekend_shift_history]]
    tallkontroll: ok

  # ---------- Kanttilfeller ----------
  - id: K1
    kategori: kant
    turer: ["Hvem kan ta vakt på Takterrassen lørdag 7. november 2026 kl. 08–16?"]
    fasit: []
    forventet: ["Takterrassen"]
    forbudt: ["Fredrik Ruud", "Fatima Al-Mansoor"]
    verktoy_krav: [[get_staffing_candidates], [list_stations]]
    se_etter: Stasjonen finnes ikke. Modellen skal si det, ikke foreslå folk fra en annen stasjon.

  - id: K2
    kategori: kant
    turer: ["Hvem har vakt 5. mai 2031?"]
    fasit: []
    forventet: [["ingen", "ikke"]]
    verktoy_krav: [[get_shifts_for_date], [get_staff_on_shift]]
    se_etter: Det finnes ingen vakter så langt fram. Modellen skal ikke dikte opp navn.

  - id: K3
    kategori: kant
    turer: ["Hva står i CV-en til KP-ANS-999?"]
    fasit: []
    forventet: [["finnes ikke", "fant ingen", "ingen CV", "ikke funnet", "fant ikke", "finner ikke", "ingen persona"]]
    verktoy_krav: [[get_employee_cv]]
    maks_kall: 3

  - id: K4
    kategori: kant
    turer: ["Hvem kan ta vakt i vaktrommet førstkommende lørdag kl. 08–16?"]
    fasit: [{verktoy: get_staffing_candidates, args: {stasjon: "Vaktrom / Sikkerhetssentral", dato: "2026-11-07", start: "08:00", slutt: "16:00"}}]
    forventet: ["Fredrik Ruud"]
    args_krav: [{verktoy: get_staffing_candidates, args: {dato: "2026-11-07"}}]
    verktoy_krav: [[get_staffing_candidates]]
    se_etter: «I dag» er mandag 2026-11-02 i systemprompten, så førstkommende lørdag er 2026-11-07.

  - id: K5
    kategori: kant
    turer: ["Hva er timeprisen til Stian i vaktrommet 7. november 2026 kl. 08–16?"]
    fasit: [{verktoy: get_staffing_candidates, args: {stasjon: "Vaktrom / Sikkerhetssentral", dato: "2026-11-07", start: "08:00", slutt: "16:00"}}]
    forventet: ["Stian Pedersen", "Stian Haugen"]
    verktoy_krav: [[get_staffing_candidates], [search_active_contractors]]
    se_etter: To personer heter Stian. Modellen skal nevne begge eller spørre hvem som menes.

  # ---------- Samtale med flere turer ----------
  - id: T1
    kategori: samtale
    turer:
      - "Hvem kan ta vakt i vaktrommet lørdag 7. november 2026 kl. 08–16?"
      - "Og søndag 8. november, samme tid?"
    fasit: [{verktoy: get_staffing_candidates, args: {stasjon: "Vaktrom / Sikkerhetssentral", dato: "2026-11-08", start: "08:00", slutt: "16:00"}}]
    forventet: ["Fredrik Ruud"]
    args_krav: [{verktoy: get_staffing_candidates, args: {dato: "2026-11-08"}}]
    verktoy_krav: [[get_staffing_candidates]]

  - id: T2
    kategori: samtale
    turer:
      - "Hvem er billigst av de innleide vekterne med gyldige kurs til vaktrommet 7. november 2026 kl. 08–16?"
      - "Skriv en kort melding til henne om vakten."
    fasit: [{verktoy: get_staffing_candidates, args: {stasjon: "Vaktrom / Sikkerhetssentral", dato: "2026-11-07", start: "08:00", slutt: "16:00"}}]
    forventet: ["Fatima", ["7. november", "07.11", "2026-11-07", "lørdag"]]
    se_etter: Andre tur har ingen nye verktøykall nødvendig. Meldingen skal bruke navnet og vakten fra første tur.

  # ---------- Vaktplan, bytte, HR, håndbok og samtaler (lagt til etter test av vaktchatten) ----------
  - id: V1
    kategori: fakta
    turer: ["Hvem har vakt søndag 1. november 2026, og når starter og slutter vaktene?"]
    fasit: [{verktoy: get_shifts_for_date, args: {dato: "2026-11-01"}}]
    forventet: ["Astrid Moen", "10:00", "18:00"]
    verktoy_krav: [[get_shifts_for_date]]
    maks_kall: 3
    se_etter: Tidene skal komme fra vaktplanen, ikke gjettes.

  - id: V2
    kategori: bemanning
    turer: ["Kan Astrid Moen og Frida Lund bytte vaktene sine søndag 1. november 2026? Sjekk begge veier."]
    fasit: [{verktoy: check_shift_swap, args: {vakt_a: VAKT-0054457, vakt_b: VAKT-0054463}}]
    forventet: ["kasse", "Frida Lund"]
    verktoy_krav: [[check_shift_swap]]
    se_etter: Byttet går én vei. Frida Lund mangler kassekurs for resepsjonen.

  - id: V3
    kategori: fakta
    turer: ["Hvem i HR kan jeg kontakte om et vaktbytte?"]
