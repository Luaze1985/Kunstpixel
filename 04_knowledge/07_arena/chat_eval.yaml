# Eval-sett for KI-chatten i Datafinner (POST /api/chat, llm.chat_med_verktoy).
# Kjøres mot ekte KI med:  py -3.13 scripts/chat_eval.py --k 3
# Fasiten vokses av tests/test_chat_eval_fasit.py uten KI: hvert «fasit»-steg kjøres, og «forventet» må finnes i svaret.
#
# Felter per oppgave:
#   id, kategori, rolle
#   turer           brukermeldinger i rekkefølge (flere = samtale). Sjekkene gjelder siste svar.
#   fra_grense      i stedet for turer: hent forespørselen fra grensecaser.yaml (bare kategori observasjon)
#   fasit           [{verktoy, args}] som beviser fasiten. Tom liste = kanttilfelle uten datafasit.
#   forventet       hvert punkt må stå i svaret. Et punkt er en tekst eller en liste med alternativer (ett holder).
#   utregnet        [{uttrykk, verdi}]: verdien må stå i svaret; fasittesten regner uttrykket.
#   forbudt         tekster som ikke får stå i svaret
#   verktoy_krav    liste med alternative sett: minst ett sett må være brukt (rekkefølge spiller ingen rolle)
#   args_krav       [{verktoy, args}]: minst ett kall til verktøyet må ha disse argumentene
#   maks_kall       tak på antall verktøykall (standard 6)
#   tallkontroll    ok (krev ingen ukjente tall) eller ignorer (standard)
#   se_etter        merknad til mennesket som leser transkriptet
#
# Tall sammenlignes normalisert: mellomrom i tall fjernes, og desimalkomma blir punktum ("2 279,36" = "2279.36").
# Kategorien observasjon gir ingen poeng. Svaret lagres for lesing, fordi Datafinner kjører uten sperrer.
versjon: 1
dato_i_dag: "2026-11-02"   # fast «i dag» i systemprompten, så relative datoer har én fasit (mandag)
standard_rolle: Driftsansvarlig

oppgaver:
  # ---------- Fakta, ett verktøy ----------
  - id: F1
    kategori: fakta
    turer: ["Hvilke kurs må man ha for å stå i vaktrommet?"]
    fasit: [{verktoy: list_stations, args: {}}]
    forventet: ["vekter", "førstehjelp"]
    verktoy_krav: [[list_stations], [get_staffing_candidates]]
    maks_kall: 3

  - id: F2
    kategori: fakta
    turer: ["Hvilke innleide vektere har vi avtale med?"]
    fasit: [{verktoy: search_active_contractors, args: {kategori: vakthold}}]
    forventet: ["Fatima Al-Mansoor", "Stian Haugen", "Trond Bakken"]
    verktoy_krav: [[search_active_contractors]]
    maks_kall: 3

  - id: F3
    kategori: fakta
    turer: ["Hvilken utdanning har KP-ANS-153?"]
    fasit: [{verktoy: get_employee_cv, args: {ident: KP-ANS-153}}]
    forventet: ["Sindre Lindqvist", "Visuell kultur", ["UiB", "Universitetet i Bergen"]]
    verktoy_krav: [[get_employee_cv]]
    maks_kall: 2

  - id: F4
    kategori: fakta
    turer: ["Hva står i personalmappen til KP-ANS-006?"]
    fasit: [{verktoy: get_personnel_file, args: {ansatt_id: KP-ANS-006}}]
    forventet: ["Jonas Berg", ["oppfølgingsplan", "sykeoppfølging", "sykeoppfolging"]]
    verktoy_krav: [[get_personnel_file]]
    maks_kall: 2

  - id: F5
    kategori: fakta
    turer: ["Hva sier håndbøkene om omfattende brann?"]
    fasit: [{verktoy: lookup_handbook, args: {query: brann, limit: 3}}]
    forventet: [["Beredskap", "LEDER_BEREDSKAP"]]
    verktoy_krav: [[lookup_handbook]]
    maks_kall: 3

  - id: F6
    kategori: fakta
    turer: ["Hva sier HMS-veiledningen om ergonomi?"]
    fasit: [{verktoy: search_hms_guidance, args: {query: ergonomi, limit: 2}}]
    forventet: ["ergonomi", ["tilrettelegg", "tilpass"]]
    verktoy_krav: [[search_hms_guidance]]
    maks_kall: 3

  - id: F7
    kategori: fakta
    turer: ["Hva koster det å besøke museet, og finnes det familiebillett?"]
    fasit: [{verktoy: search_faq, args: {query: billett}}]
    forventet: ["120", "250", "gratis"]
    verktoy_krav: [[search_faq]]
    tallkontroll: ok
    maks_kall: 3

  - id: F8
    kategori: fakta
    turer: ["Hvordan gikk utstillingen KP-EXH-2020-041 økonomisk?"]
    fasit: [{verktoy: get_exhibition_economy, args: {exhibition_id: KP-EXH-2020-041}}]
    forventet: ["511832", "828900", "4295"]
    verktoy_krav: [[get_exhibition_economy]]
    tallkontroll: ok
    maks_kall: 2

  # ---------- Utregning ----------
  - id: U1
    kategori: utregning
    turer: ["Hva koster Fredrik Ruud for en vakt i vaktrommet lørdag 7. november 2026 kl. 08–16, uten tillegg?"]
    fasit: [{verktoy: get_staffing_candidates, args: {stasjon: "Vaktrom / Sikkerhetssentral", dato: "2026-11-07", start: "08:00", slutt: "16:00"}}]
    forventet: ["284.92"]
    utregnet: [{uttrykk: "284.92 * 8", verdi: "2279.36"}]
    verktoy_krav: [[get_staffing_candidates]]
    tallkontroll: ok
    se_etter: Skriver modellen regnestykket, så tallkontrollen kan regne det etter?

  - id: U2
    kategori: utregning
    turer: ["Gikk juni 2026 i pluss? Hva var billettinntekt, vaktkostnad og differansen?"]
    fasit: [{verktoy: get_period_result, args: {maaned: "2026-06"}}]
    forventet: ["1057720", ["776898", "776899"], "280821"]
    verktoy_krav: [[get_period_result]]
    tallkontroll: ok
    se_etter: Tar modellen med at dette ikke er driftsresultatet (merknaden fra verktøyet)?

  - id: U3
    kategori: utregning
    turer: ["Hva blir summen av timeprisene til Fatima Al-Mansoor og Stian Haugen?"]
    fasit: [{verktoy: search_active_contractors, args: {kategori: vakthold}}]
    forventet: ["734", "790"]
    utregnet: [{uttrykk: "734 + 790", verdi: "1524"}]
    verktoy_krav: [[search_active_contractors], [get_staffing_candidates]]
    tallkontroll: ok

  - id: U4
    kategori: utregning
    turer: ["Hvor mye dyrere per time er den billigste innleide enn den billigste egne ansatte i vaktrommet 7. november 2026 kl. 08–16?"]
    fasit: [{verktoy: get_staffing_candidates, args: {stasjon: "Vaktrom / Sikkerhetssentral", dato: "2026-11-07", start: "08:00", slutt: "16:00"}}]
    forventet: ["Fatima Al-Mansoor", "Fredrik Ruud"]
    utregnet: [{uttrykk: "734 - 284.92", verdi: "449.08"}]
    verktoy_krav: [[get_staffing_candidates]]
    tallkontroll: ok

  # ---------- Bemanning i flere steg ----------
  - id: B1
