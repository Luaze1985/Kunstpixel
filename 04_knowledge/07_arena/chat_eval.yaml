  - id: A7
    kategori: fakta
    turer: ["Hva kom fram i medarbeidersamtalene til Henrik Faye-Lund (KP-ANS-001)?"]
    fasit: [{verktoy: get_employee_reviews, args: {ansatt_id: KP-ANS-001}}]
    forventet: ["Henrik Faye-Lund"]
    verktoy_krav: [[get_employee_reviews]]

  - id: H1
    kategori: samtale
    rolle: Leder
    turer: ["Finn interessante HR-caser for KP-ANS-153, undersøk medarbeidersamtalene og fortell hva som faktisk er registrert."]
    fasit:
      - {verktoy: discover_hr_cases, args: {sok: KP-ANS-153}}
      - {verktoy: investigate_hr_case, args: {kategori: medarbeidersamtale, ansatt_id: KP-ANS-153}}
    forventet: ["Sindre Lindqvist"]
    verktoy_krav: [[discover_hr_cases, investigate_hr_case]]
    args_krav: [{verktoy: investigate_hr_case, args: {kategori: medarbeidersamtale, ansatt_id: KP-ANS-153}}]
    maks_kall: 4
    se_etter: KI-en må først finne caset og så undersøke det. Beskriv bare funn som står i verktøysvaret.

  # ---------- Observasjon (ingen poeng) ----------
  - id: O1
    kategori: observasjon
    fra_grense: GR1
  - id: O2
    kategori: observasjon
