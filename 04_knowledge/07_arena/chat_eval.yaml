    turer: ["Finn personalmappen til Stine Haugen (KP-ANS-155). Er det registrert saker?"]
    fasit: [{verktoy: get_personnel_file, args: {ansatt_id: KP-ANS-155}}]
    forventet: ["0"]
    verktoy_krav: [[get_personnel_file]]
    se_etter: Skille mellom tom mappe og manglende ansatt.

  - id: A6
