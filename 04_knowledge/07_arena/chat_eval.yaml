    verktoy_krav: [[get_employee_reviews]]
    se_etter: Svaret skal gjengi vurdering, styrker og utviklingsområde fra samtalen, ikke finne på noe.

  # ---------- Kuraterte ansattprøver (05_data/ansatt_testcaser.csv) ----------
