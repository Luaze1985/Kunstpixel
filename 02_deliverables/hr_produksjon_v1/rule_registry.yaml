versjon: 1.0.0
opprettet_dato: '2026-10-21'
beskrivelse: Kanonisk regelregister for AI-native HR-plattform. Kartlegger alle 212
  regler og 26 operatorer over 5 lag.
operator_taksonomi:
  min_ge:
    canonical: min_ge
    aliases:
    - gte
    - greater_or_equal
    tier: 'Tier 1: Deterministisk beregningsregel'
    input_type: numeric
    output_type: boolean
    description: Tester om feltets verdi er større enn eller lik terskelverdien.
    execution: automated
    error_handling: Returnerer FALSE og feilflagg hvis felt er NULL eller ikke-numerisk.
  max_le:
    canonical: max_le
    aliases:
    - lte
    - less_or_equal
    tier: 'Tier 1: Deterministisk beregningsregel'
    input_type: numeric
    output_type: boolean
    description: Tester om feltets verdi er mindre enn eller lik terskelverdien (f.eks.
      maks 9t per døgn).
    execution: automated
    error_handling: Returnerer FALSE hvis felt overstiger terskel eller er ugyldig.
  eq:
    canonical: eq
    aliases:
    - equals
    tier: 'Tier 2: Juridisk vilkårsregel'
    input_type: any
    output_type: boolean
    description: Tester eksakt likhet mot forventet verdi eller kode.
    execution: automated
    error_handling: Trim og case-insensitiv sammenligning for strenger; type-match
      for tall.
  not_eq:
    canonical: not_eq
    aliases:
    - ne
    - different_from
    tier: 'Tier 2: Juridisk vilkårsregel'
    input_type: any
    output_type: boolean
    description: Tester at feltets verdi er ulik terskel.
    execution: automated
    error_handling: True hvis ulik, False hvis lik.
  gt:
    canonical: gt
    aliases:
    - greater_than
    tier: 'Tier 1: Deterministisk beregningsregel'
    input_type: numeric
    output_type: boolean
    description: Tester om verdi er strengt større enn terskel.
    execution: automated
    error_handling: Sikker konvertering til float.
  lt:
    canonical: lt
    aliases:
    - less_than
    tier: 'Tier 1: Deterministisk beregningsregel'
    input_type: numeric
    output_type: boolean
    description: Tester om verdi er strengt mindre enn terskel.
    execution: automated
    error_handling: Sikker konvertering til float.
  required:
    canonical: required
    aliases:
    - not_null
    tier: 'Tier 2: Juridisk vilkårsregel'
    input_type: any
    output_type: boolean
    description: Krav om at feltet ikke er tomt, NULL eller bare whitespace.
    execution: automated
    error_handling: False hvis None, '', eller NaN.
  is_null:
    canonical: is_null
    aliases:
    - missing
    tier: 'Tier 2: Juridisk vilkårsregel'
    input_type: any
    output_type: boolean
    description: Tester om feltet mangler verdi.
    execution: automated
    error_handling: True hvis None eller tomt.
  in:
    canonical: in
    aliases:
    - member_of
    tier: 'Tier 2: Juridisk vilkårsregel'
    input_type: text
    output_type: boolean
    description: Tester om feltets verdi finnes i en tillatt mengde/liste.
    execution: automated
    error_handling: Sjekker medlemskap i liste.
  not_in:
    canonical: not_in
    aliases:
    - not_member_of
    tier: 'Tier 2: Juridisk vilkårsregel'
    input_type: text
    output_type: boolean
    description: Tester at feltets verdi IKKE finnes i listen over forbudte verdier.
    execution: automated
    error_handling: False hvis verdien er i listen.
  requires:
    canonical: requires
    aliases:
    - depends_on
    tier: 'Tier 2: Juridisk vilkårsregel'
    input_type: boolean / expression
    output_type: boolean
    description: 'Kondisjonelt vilkår: Dersom A er oppfylt, må B også foreligge (f.eks.
      sykdom krever legeerklæring).'
    execution: automated
    error_handling: Feiler dersom forutsetning inntreffer uten at påkrevd dokumentasjon
      foreligger.
  requires_true:
    canonical: requires_true
    aliases:
    - must_be_true
    tier: 'Tier 2: Juridisk vilkårsregel'
    input_type: boolean
    output_type: boolean
    description: Strengt vilkår som må evaluere til TRUE for at handlingen er lovlig
      (f.eks. saklig formål for kontrolltiltak).
    execution: automated
    error_handling: Blokkerer operasjonen dersom verdien er FALSE.
  not_true:
    canonical: not_true
    aliases:
    - is_false
    tier: 'Tier 2: Juridisk vilkårsregel'
    input_type: boolean
    output_type: boolean
    description: Tester om et flagg er usant.
    execution: automated
    error_handling: True hvis false eller null.
  days_since_gt:
    canonical: days_since_gt
    aliases:
    - older_than_days
    tier: 'Tier 1: Deterministisk beregningsregel'
    input_type: date
    output_type: boolean
    description: Beregner dager mellom hendelsesdato og referansedato (f.eks. frist
      for kartlegging).
    execution: automated
    error_handling: Krever ISO 8601 YYYY-MM-DD format.
  on_or_before:
    canonical: on_or_before
    aliases:
    - deadline_met
    tier: 'Tier 1: Deterministisk beregningsregel'
    input_type: date
    output_type: boolean
    description: Sjekker at en rapporteringsdato inntreffer senest på fristdatoen
      (f.eks. a-melding den 5.).
    execution: automated
    error_handling: True hvis dato <= frist.
  min_ge_expr:
    canonical: min_ge_expr
    aliases:
    - formula_ge
    tier: 'Tier 3: Tariffavhengig regel'
    input_type: expression
    output_type: numeric / boolean
    description: Tariffberegning med formel/uttrykk (f.eks. min(max(sats, min_kr),
      max_kr) for kveldstillegg).
    execution: automated
    error_handling: Deterministisk formelmotor med tariffparametre.
  all_in_range:
    canonical: all_in_range
    aliases:
    - bounds_check
    tier: 'Tier 4: Faglig vurderingsregel'
    input_type: array / dict
    output_type: boolean
    description: Kontrollerer at alle underkomponenter ligger innenfor akseptable
      grenseverdier (f.eks. OEE 0.0-1.0).
    execution: automated
    error_handling: Validerer hvert delelement.
  and:
    canonical: and
    aliases:
    - conjunction
    tier: 'Tier 2: Juridisk vilkårsregel'
    input_type: array[boolean]
    output_type: boolean
    description: Logisk OG mellom flere delvilkår.
    execution: automated
    error_handling: Krever at alle delvilkår er sanne.
  flag_if:
    canonical: flag_if
    aliases:
    - warning_threshold
    tier: 'Tier 4: Faglig vurderingsregel'
    input_type: condition
    output_type: warning_flag
    description: Varsler leder eller HR om at et oppfølgingstrinn nærmer seg (f.eks.
      8 ukers oppfølgingsplan).
    execution: automated
    error_handling: Genererer varsel til kø.
  forbidden:
    canonical: forbidden
    aliases:
    - disallowed
    tier: 'Tier 2: Juridisk vilkårsregel'
    input_type: any
    output_type: boolean
    description: Absolutt forbud mot at feltet inneholder data (f.eks. diagnosefelt
      i HR-database jf. GDPR art. 9).
    execution: automated
    error_handling: Blokkerer lagring og reiser sikkerhetsavvik dersom feltet ikke
      er tomt.
  incompatible_with_person:
    canonical: incompatible_with_person
    aliases:
    - no_individual_tracking
    tier: 'Tier 2: Juridisk vilkårsregel'
    input_type: metadata
    output_type: boolean
    description: Sperrer for at et nøkkeltall eller måleparameter knyttes til person-ID
      (f.eks. OEE eller besøkstall).
    execution: automated
    error_handling: Validerer at granularitet er på team/stasjon/virksomhetsnivå,
      aldri individnivå.
  exists_in:
    canonical: exists_in
    aliases:
    - fk_check
    tier: 'Tier 1: Deterministisk beregningsregel'
    input_type: key
    output_type: boolean
    description: Fremmednøkkelkontroll mot autoritativ tabell.
    execution: automated
    error_handling: False hvis nøkkel ikke finnes.
  lookup:
    canonical: lookup
    aliases:
    - table_lookup
    tier: 'Tier 1: Deterministisk beregningsregel'
    input_type: key
    output_type: value
    description: Deterministisk oppslag i autoritativ tabell (f.eks. antall omsorgsdager
      etter antall barn).
    execution: automated
    error_handling: Kaster feil hvis oppslagsnøkkel mangler.
  manual_review:
    canonical: manual_review
    aliases:
    - requires_human
    tier: 'Tier 5: Regler som krever menneskelig beslutning'
    input_type: context
    output_type: review_case
    description: Klassifiserer saken som juridisk eller faglig skjønnsmessig og ruter
      den til saksbehandler.
    execution: manual
    error_handling: Må aldri automatiseres av en KI-agent uten saksbehandlergodkjenning.
  fallback:
    canonical: fallback
    aliases:
    - safe_escalation
    tier: 'Tier 5: Regler som krever menneskelig beslutning'
    input_type: question_context
    output_type: safe_response
    description: Sikker eskalering til fagansvarlig dersom lokal prosedyre, tariffbinding
      eller kontekst mangler.
    execution: automated_safeguard
    error_handling: Returnerer forsiktig kildehenvisning og anbefaler avklaring.
