versjon: 1.0.0
datasett_formal: Standardiserte datakontrakter for AI-native HR-plattform (Kunstmuseum
  med sammenligningssektorer)
kjerne_tabeller_museum_db:
  hr_ansatte:
    beskrivelse: Hovedregister over ansatte i virksomheten.
    primaernokkel: ansatt_id
    format: KP-ANS-XXX
    felter:
      ansatt_id:
        type: string
        pakrevd: true
        unik: true
      navn:
        type: string
        pakrevd: true
      kjonn:
        type: string
        tillatte_verdier:
        - K
        - M
      fodselsaar:
        type: integer
        min: 1940
        max: 2010
      avdeling:
        type: string
        tillatte_verdier:
        - Ledelse
        - Kuratering
        - Samling
        - Formidling
        - Drift
        - Marked
      stilling:
        type: string
        pakrevd: true
      ansatt_fra:
        type: date_iso8601
        pakrevd: true
      ansatt_til:
        type: date_iso8601
        nullable: true
      status:
        type: string
        tillatte_verdier:
        - Fast
        - Midlertidig
        - Vikar
        - Sluttet
      stillingsprosent:
        type: float
        min: 0.05
        max: 1.0
      lonnstrinn_virke:
        type: integer
        min: 20
        max: 95
        alias: lonnstrinn
      epost:
        type: email
        pakrevd: true
      styrk08_kode:
        type: string
        format: XXXX.XX
        alias: stilling_styrk08
    sensitivitet: Fortrolig (Internt personalregister)
  hr_vakter:
    beskrivelse: Gjennomførte og planlagte vakter og timeregistreringer.
    primaernokkel: vakt_id
    format: VAKT-XXXXXXX
    fremmednokler:
      ansatt_id: hr_ansatte.ansatt_id
    felter:
      vakt_id:
        type: string
        pakrevd: true
        unik: true
      ansatt_id:
        type: string
        pakrevd: true
      dato:
        type: date_iso8601
        pakrevd: true
      start:
        type: time_hhmm
        pakrevd: true
      slutt:
        type: time_hhmm
        pakrevd: true
      timer:
        type: float
        min: 0.5
        max: 16.0
      stasjon:
        type: string
        nullable: true
      avdeling:
        type: string
        pakrevd: true
    sensitivitet: Internt (Arbeidstid)
  hr_fravaer:
    beskrivelse: Registrert fravær (egenmelding, sykemelding, permisjon).
    primaernokkel: fravaer_id
    format: FRAV-XXXXXX
    fremmednokler:
      ansatt_id: hr_ansatte.ansatt_id
    felter:
      fravaer_id:
        type: string
        pakrevd: true
        unik: true
      ansatt_id:
        type: string
        pakrevd: true
      fra:
        type: date_iso8601
        pakrevd: true
      til:
        type: date_iso8601
        pakrevd: true
      type:
        type: string
        tillatte_verdier:
        - egenmelding
        - sykemelding
        - permisjon
        - annet
    sensitivitet: Strengt fortrolig (Helse/GDPR Art. 9) - Diagnoser er strengt FORBUDT
  virke_tariff:
    beskrivelse: Lønnstabell basert på Virke Landsoverenskomst for museer.
    primaernokkel: lonnstrinn
    felter:
      lonnstrinn:
        type: integer
        pakrevd: true
        unik: true
      timesats_ordinar:
        type: float
        pakrevd: true
      timesats_kveld:
        type: float
        pakrevd: true
      timesats_helg:
        type: float
        pakrevd: true
      timesats_helligdag:
        type: float
        pakrevd: true
    sensitivitet: Offentlig / Tariffavtale
