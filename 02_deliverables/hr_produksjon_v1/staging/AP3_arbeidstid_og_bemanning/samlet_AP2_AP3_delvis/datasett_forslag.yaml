# Delvis sammenslått: AP2 + AP3. Mangler AP0 og AP1. Ingen AP2-data endret.
- tabell: hr_lonnsavtale_versjon
  omraade: 2
  sektor:
  - industri
  - privat
  - kommune
  kilde: https://www.fellesforbundet.no/lonn-og-tariff/tariffavtaler/industrioverenskomst/ | https://www.virke.no/tariff-og-lonn/finn-tariffavtale/landsoverenskomsten-hk/
    | https://www.ks.no/hta
  kolonner:
  - navn: ansatt_id
    type: tekst
    kobles_til: hr_ansatte.ansatt_id
  - navn: tariff_id
    type: tekst
    tillatte_verdier: Spesifikk aktiv tariffavtale-ID; ikke bare sektor
  - navn: tariff_avtaledel
    type: tekst
    tillatte_verdier: Verifisert avtaledel; kan være tom for ikke-tariffbundet
  - navn: sektor
    type: tekst
    tillatte_verdier: industri|privat|kommune
  - navn: stillingsprosent
    type: desimaltall
    kobles_til: hr_ansatte.stillingsprosent
  - navn: stilling_styrk08
    type: tekst
    kobles_til: hr_ansatte.styrk_08
  - navn: lonnstrinn
    type: tekst
    kobles_til: hr_ansatte.lonnstrinn
  - navn: timelonn_kroner
    type: desimaltall
    fordeling: Betinget på STYRK-08 x sektor x heltid; kalibrer Q1/median/Q3 mot SSB 11418 (2025) og tariffgulv (2026)
  - navn: gyldig_fra
    type: dato
  - navn: gyldig_til
    type: dato_eller_null
  - navn: kilde_dato
    type: dato
- tabell: hr_lonnsarter
