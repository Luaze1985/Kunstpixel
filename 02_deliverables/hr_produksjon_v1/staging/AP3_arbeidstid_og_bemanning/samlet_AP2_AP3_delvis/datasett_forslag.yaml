- tabell: hr_arbeidstidsordning
  omraade: 3
  sektor:
  - industri
  - privat
  - kommune
  kilde: https://www.arbeidstilsynet.no/regelverk/lover/arbeidsmiljoloven--aml/ | https://www.ks.no/fagomrader/lonn-og-tariff/hovedtariffavtalen/beregning-av-tilleggslonn/
    | https://www.fellesforbundet.no/globalassets/lonn-og-tariffsaker/tariffavtaler/overenskomster-20262028/industrioverenskomsten---resultater-og-endringer-i-taroffoppgjoret-2026.pdf
