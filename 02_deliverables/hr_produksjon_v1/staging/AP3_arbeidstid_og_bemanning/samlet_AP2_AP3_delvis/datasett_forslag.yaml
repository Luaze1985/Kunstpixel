  - navn: tariff_id
    type: tekst
  - navn: sektor
    type: tekst
    tillatte_verdier: industri|privat|kommune
  - navn: sats_type
    type: tekst
    tillatte_verdier: fast_kroner|prosent|maks_prosent_kronegulv|individuell
  - navn: sats_verdi
    type: desimaltall
    kommentar: Må kobles til riktig avtale og gyldighetsperiode; ikke generell sektorverdi
