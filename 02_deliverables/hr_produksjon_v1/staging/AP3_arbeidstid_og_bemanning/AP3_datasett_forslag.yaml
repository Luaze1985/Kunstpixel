# AP3. Bare tabelldesign. Syntetiske observasjoner er ikke generert. Kontrollert 2026-10-20.
- tabell: hr_arbeidstidsordning
  omraade: 3
  sektor:
  - industri
  - privat
  - kommune
  kilde: https://www.arbeidstilsynet.no/regelverk/lover/arbeidsmiljoloven--aml/ | https://www.ks.no/fagomrader/lonn-og-tariff/hovedtariffavtalen/beregning-av-tilleggslonn/
    | https://www.fellesforbundet.no/globalassets/lonn-og-tariffsaker/tariffavtaler/overenskomster-20262028/industrioverenskomsten---resultater-og-endringer-i-taroffoppgjoret-2026.pdf
  kolonner:
  - navn: arbeidstidsordning_id
    type: tekst
    unik: true
  - navn: sektor
    type: tekst
    tillatte_verdier: industri|privat|kommune
  - navn: tariff_id
    type: tekst
    kobles_til: hr_lonnsavtale_versjon.tariff_id
  - navn: tariff_avtaledel
    type: tekst_eller_null
  - navn: ukenorm_timer
    type: desimaltall
    tillatte_verdier: 9/40 som lovutgangspunkt; 37.5|36.5|35.5|33.6 bare etter avtale og relevant ordning; annet når dokumentert
  - navn: ordningstype
    type: tekst
    tillatte_verdier: dagtid|fleksi|delt_skift|dognkont_skift|helkont_skift|tredelt_turnus|annen_verifisert
  - navn: arbeidssted_tidssone
    type: tekst
    tillatte_verdier: Europe/Oslo; annet hvis dokumentert
  - navn: gyldig_fra
    type: dato
  - navn: gyldig_til
    type: dato_eller_null
  - navn: dokumentasjon_url
    type: url_eller_null
- tabell: hr_arbeidstidsavtale
  omraade: 3
  sektor:
  - industri
  - privat
  - kommune
  kilde: https://www.arbeidstilsynet.no/regelverk/lover/arbeidsmiljoloven--aml/ | https://www.arbeidstilsynet.no/arbeidstid-og-organisering/arbeidstid/gjennomsnittsberegning/
    | https://www.ssb.no/arbeid-og-lonn/sysselsetting/artikler/dette-er-de-vanligste-jobbene-i-norge
  kolonner:
  - navn: ansatt_id
    type: tekst
    kobles_til: hr_ansatte.ansatt_id
  - navn: arbeidstidsordning_id
    type: tekst
    kobles_til: hr_arbeidstidsordning.arbeidstidsordning_id
  - navn: stillingsprosent
    type: desimaltall
    kobles_til: hr_ansatte.stillingsprosent
    tillatte_verdier: 0–100 pluss dokumenterte særordninger; ingen tilfeldig yrkesuavhengig sats
  - navn: arbeidstid_timer_uke
    type: desimaltall
    fordeling: stillingsprosent × dokumentert ukenorm; kalibrer yrkesfordeling mot AKU 2025 og tabell 14756/14757
  - navn: gjennomsnittsavtale_type
    type: tekst
    tillatte_verdier: ingen|individuell_skriftlig|tariff_lokal_skriftlig|arbeidstilsynet|sentralt_tariffunntak
  - navn: gjennomsnitt_periode_uker
    type: heltall_eller_null
    tillatte_verdier: 1–52 avhengig av hjemmel
  - navn: overtid_utvidelse_type
    type: tekst
    tillatte_verdier: ingen|lokal_tariff_skriftlig|arbeidstilsynet|sentral_tariff
  - navn: hvile_unntak_dokumentert
    type: boolsk
  - navn: gyldig_fra
    type: dato
  - navn: gyldig_til
    type: dato_eller_null
  - navn: dokument_ref
    type: tekst_eller_null
- tabell: hr_vaktplan_versjon
  omraade: 3
  sektor:
  - industri
  - privat
  - kommune
  kilde: https://www.arbeidstilsynet.no/regelverk/lover/arbeidsmiljoloven--aml/ | https://www.arbeidstilsynet.no/arbeidstid-og-organisering/arbeidstid/arbeidsplan-vaktliste-skift-og-turnus/
  kolonner:
  - navn: vaktplan_id
    type: tekst
    unik: true
  - navn: vakt_id
    type: tekst
    kobles_til: vakter.vakt_id
  - navn: ansatt_id
    type: tekst
    kobles_til: hr_ansatte.ansatt_id
  - navn: avdeling
    type: tekst
    kobles_til: hr_ansatte.avdeling
  - navn: plan_start_lokal
    type: datetime_tz
  - navn: plan_slutt_lokal
    type: datetime_tz
  - navn: planversjon
    type: heltall
    tillatte_verdier: '>=1'
  - navn: plan_publisert_at
    type: datetime_tz
  - navn: plan_drøftet_at
    type: datetime_tz_eller_null
  - navn: endring_grunn
    type: tekst
    tillatte_verdier: ordinær|etter_avtale|uforutsett|overtid_behov|korrigering
  - navn: status
    type: tekst
    tillatte_verdier: utkast|publisert|endret|avlyst
  - navn: dokumentasjon_unntak
    type: tekst_eller_null
- tabell: hr_tidregistrering
  omraade: 3
  sektor:
  - industri
  - privat
  - kommune
  kilde: https://www.arbeidstilsynet.no/regelverk/lover/arbeidsmiljoloven--aml/ | https://www.arbeidstilsynet.no/arbeidstid-og-organisering/arbeidstid/registrering-av-arbeidstid/
    | https://www.arbeidstilsynet.no/arbeidstid-og-organisering/arbeidstid/overtid/
  kolonner:
  - navn: tidregistrering_id
    type: tekst
    unik: true
  - navn: vakt_id
    type: tekst
    kobles_til: vakter.vakt_id
  - navn: ansatt_id
    type: tekst
    kobles_til: hr_ansatte.ansatt_id
  - navn: plan_vakt_id
    type: tekst_eller_null
    kobles_til: hr_vaktplan_versjon.vaktplan_id
  - navn: faktisk_start
    type: datetime_tz
  - navn: faktisk_slutt
    type: datetime_tz
  - navn: pause_fra
    type: datetime_tz_eller_null
  - navn: pause_til
    type: datetime_tz_eller_null
  - navn: pause_er_arbeidstid
    type: boolsk_eller_ukjent
  - navn: faktiske_arbeidsminutter
    type: heltall
    fordeling: utledet fra tidsstempler og betalte pauser; IKKE fra tilfeldig normalfordeling
  - navn: klassifisering
    type: tekst
    tillatte_verdier: ordinær|merarbeid|overtid|uavklart
  - navn: beregnings_hjemmel
    type: tekst_eller_null
  - navn: datakilde
    type: tekst
    tillatte_verdier: syntetisk tidslogg – regel- og statistikkforankret
  - navn: scenario_id
    type: tekst_eller_null
- tabell: hr_bemanningsbehov
  omraade: 3
  sektor:
  - industri
  - privat
  - kommune
  kilde: https://www.arbeidstilsynet.no/regelverk/lover/arbeidsmiljoloven--aml/ | https://www.arbeidstilsynet.no/arbeidstid-og-organisering/arbeidstid/
  kolonner:
  - navn: behov_id
    type: tekst
    unik: true
  - navn: avdeling
    type: tekst
    kobles_til: hr_ansatte.avdeling
  - navn: stasjon
    type: tekst_eller_null
    kobles_til: vakter.stasjon
  - navn: periode_start
    type: datetime_tz
  - navn: periode_slutt
    type: datetime_tz
  - navn: min_ansatte
    type: heltall
    tillatte_verdier: '>=0; parametervalg fra lokal risikovurdering, ikke nasjonal lovgrense'
  - navn: krav_kompetansekoder
    type: liste_tekst
    kobles_til: kompetanse.sertifikater
  - navn: planlagte_ansatte
    type: heltall
  - navn: dekning_gap
    type: heltall
    fordeling: utledet planlagt minus dokumentert behov
  - navn: bemanningsgrunnlag
    type: tekst
    tillatte_verdier: lokal_risikovurdering|apningstid|sikkerhetskrav|produksjonsbehov|syntetisk_scenario
  - navn: scenario_id
    type: tekst_eller_null
