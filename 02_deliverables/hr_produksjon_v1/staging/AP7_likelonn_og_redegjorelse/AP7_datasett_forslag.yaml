# AP7 maskinlesbare tabellforslag. Ingen faktiske eller oppdiktede personrader.
- tabell: hr_arp_virksomhet
  omraade: 7
  beskrivelse: Juridisk arbeidsgiver og terskelvurdering; antall ansatte verifiseres i et årssnitt.
  sektor:
  - industri
  - privat
  - kommune
  kilde: https://lovdata.no/lov/2017-06-16-51/rdkn/a4
  kolonner:
  - navn: virksomhet_id
    type: tekst
    unik: true
  - navn: juridisk_form
    type: tekst
    tillatte_verdier:
    - kommune
    - offentlig_annet
    - privat_as
    - privat_annet
    - ukjent
  - navn: sektor
    type: tekst
    tillatte_verdier:
    - industri
    - privat
    - kommune
  - navn: rapportaar
    type: heltall
  - navn: ansatte_aarsgjennomsnitt
    type: desimaltall
    fordeling: beregnes fra faktisk bemanningsregister; ikke generer fra nasjonalt lønnsgap
  - navn: parts_krav_utvidet_arp
    type: boolsk_eller_null
  - navn: utvidet_arp_status
    type: tekst
    tillatte_verdier:
    - paakrevd
    - ikke_utlost
    - ma_avklares
  - navn: statusbegrunnelse
    type: tekst_eller_null
- tabell: hr_arp_kartlegging
  omraade: 7
  beskrivelse: Arbeidsflyt, dato, metode og dokumentert medvirkning.
  sektor:
  - industri
  - privat
