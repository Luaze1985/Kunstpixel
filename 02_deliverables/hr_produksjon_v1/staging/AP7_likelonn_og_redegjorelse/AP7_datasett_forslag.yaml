- tabell: hr_arp_stillingsplassering
  omraade: 7
  beskrivelse: Kobler et ansattarbeidsforhold til en begrunnet stillingsgruppe per år.
  sektor:
  - industri
  - privat
  - kommune
  kilde: https://ldo.no/bli-betre-pa-likestilling-og-mangfald/aktivitets-og-redegjorelsesplikt/
  kolonner:
  - navn: plassering_id
    type: tekst
    unik: true
  - navn: ansatt_id
    type: tekst
    kobles_til: hr_ansatte.ansatt_id
    merknad: logisk kobling; kontroller faktisk SQLite-skjema
  - navn: arbeidsforhold_id
    type: tekst_eller_null
  - navn: avdeling_id
    type: tekst_eller_null
    kobles_til: hr_avdelinger.avdeling_id
  - navn: gruppe_id
    type: tekst
    kobles_til: hr_arp_stillingsgrupper.gruppe_id
  - navn: stillingskode
    type: tekst_eller_null
