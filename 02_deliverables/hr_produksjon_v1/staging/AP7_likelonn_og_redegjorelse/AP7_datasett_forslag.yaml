    type: desimaltall
    gyldig_intervall: 0-100
  - navn: gyldig_fra
    type: dato
  - navn: gyldig_til
    type: dato_eller_null
- tabell: hr_arp_lonnsgrunnlag
  omraade: 7
  beskrivelse: Syntetiske lønnskomponenter basert på AP2-lønnsarter; ingen faktisk persondata og ingen konstruert nasjonal kjønnsfordeling.
  sektor:
  - industri
  - privat
  - kommune
  kilde: https://www.bufdir.no/fagstotte/produkter/aktivitets__og_redegjorelsesplikt_for_arbeidsgivere/
  kolonner:
  - navn: lonnspost_id
    type: tekst
    unik: true
  - navn: ansatt_id
    type: tekst
    kobles_til: hr_ansatte.ansatt_id
  - navn: plassering_id
    type: tekst
    kobles_til: hr_arp_stillingsplassering.plassering_id
  - navn: dato
    type: dato
  - navn: lonnskomponent
    type: tekst
    tillatte_verdier:
    - fastlonn
    - skifttillegg
    - kveldstillegg
    - nattillegg
    - helgetillegg
    - overtid
    - bonus
    - provisjon
    - skattepliktig_naturalytelse
    - annet
  - navn: belop_kr
    type: desimaltall
    fordeling: forankres i AP2/lønnsart og målrettet SSB 11418/11419; verdi ikke utledet nå
  - navn: stillingsprosent
    type: desimaltall
  - navn: fte_justert_belop_kr
    type: desimaltall_eller_null
    merknad: avledet beregning med metodedokumentasjon; unngå ukritisk FTE-skalerte overtids- og bonusposter
  - navn: kildemodell_id
    type: tekst_eller_null
