    type: tekst
    unik: true
  - navn: virksomhet_id
    type: tekst
    kobles_til: hr_arp_virksomhet.virksomhet_id
  - navn: rapportaar
    type: heltall
  - navn: kartleggingstype
    type: tekst
    tillatte_verdier:
    - aarlig_tall
    - lonn_annet_hvert_aar
    - ufrivillig_deltid_annet_hvert_aar
  - navn: sist_kartlagt_dato
    type: dato_eller_null
  - navn: tillitsvalgte_medvirket
    type: boolsk_eller_null
  - navn: status
    type: tekst
    tillatte_verdier:
    - planlagt
    - paagar
    - ferdig
    - ukjent
  - navn: ansvarlig_rolle
    type: tekst
  - navn: dokumentasjonsreferanse
    type: tekst_eller_null
- tabell: hr_arp_stillingsgrupper
