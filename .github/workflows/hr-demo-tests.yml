name: HR demo regression tests
on:
  push:
    paths:
      - 'src/kunstpixel/core/hrdemo*.py'
      - '05_data/hr_demo/**'
      - 'tests/test_hrdemo.py'
      - '.github/workflows/hr-demo-tests.yml'
  pull_request:
    paths:
      - 'src/kunstpixel/core/hrdemo*.py'
      - '05_data/hr_demo/**'
      - 'tests/test_hrdemo.py'
      - '.github/workflows/hr-demo-tests.yml'
jobs:
  hr-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_hrdemo.py -q
